<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Playing</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #11151f; --surface: #161b28; --border: #2a3350;
    --text: #e6e9ef; --text-mid: #8089a6; --text-dim: #565f89;
    --accent: #1db954;                 /* seeded to Spotify green; retinted from art */
    --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
  }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
               font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }

  /* Ambient wash from the album art — a subtle edge tint that grounds the
     surface toward the record's colour, not a centered bloom. */
  #glow { position: fixed; inset: 0; z-index: 0; opacity: 0; transition: opacity .8s, background 1s;
          background: linear-gradient(100deg, var(--accent) -35%, transparent 46%); }
  body.playing #glow { opacity: .13; }

  #wrap { position: relative; z-index: 1; display: grid; grid-template-columns: auto 1fr; gap: 26px;
          align-items: center; height: 100vh; padding: 26px 32px; }

  /* album art — the hero */
  .art { position: relative; height: calc(100vh - 52px); aspect-ratio: 1 / 1; border-radius: 16px; overflow: hidden;
         background: var(--surface); flex-shrink: 0; }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .art .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-dim); }
  .art .ph svg { width: 40%; height: 40%; opacity: .5; }

  .right { min-width: 0; display: flex; flex-direction: column; height: 100%; justify-content: center; gap: 4px; }
  .source { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: .8rem; letter-spacing: .12em;
            text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }
  .source .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
  .source .eq i { width: 3px; background: var(--accent); border-radius: 1px; height: 40%; }
  body.playing .source .eq i { animation: eq .9s ease-in-out infinite; }
  body.playing .source .eq i:nth-child(2){ animation-delay: .2s } body.playing .source .eq i:nth-child(3){ animation-delay: .4s }
  @keyframes eq { 0%,100%{ height: 30% } 50%{ height: 100% } }

  .title { font-size: 2.6rem; font-weight: 700; line-height: 1.08; letter-spacing: -0.02em;
           overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .artist { font-size: 1.5rem; color: var(--text-mid); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .album { font-size: 1.05rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* progress */
  .prog { margin-top: 18px; display: flex; flex-direction: column; gap: 7px; }
  .bar { height: 6px; border-radius: 3px; background: rgba(128,137,166,.18); overflow: hidden; }
  .bar > div { height: 100%; width: 100%; transform: scaleX(0); transform-origin: left; background: var(--accent); border-radius: 3px; transition: transform .25s linear; }
  .times { display: flex; justify-content: space-between; font-family: var(--mono); font-variant-numeric: tabular-nums;
           font-size: .85rem; color: var(--text-dim); }
  body.no-progress .prog { display: none; }

  /* controls */
  .ctrls { margin-top: 20px; display: flex; align-items: center; gap: 18px; }
  .cbtn { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface);
          color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer;
          transition: transform .08s, border-color .08s, background .08s; -webkit-user-select: none; user-select: none; }
  .cbtn svg { width: 24px; height: 24px; fill: currentColor; }
  .cbtn:active, .cbtn.press { transform: scale(.92); border-color: var(--accent); }
  .cbtn.play { width: 72px; height: 72px; background: var(--accent); border-color: transparent; color: #0b120c; }
  .cbtn.play svg { width: 30px; height: 30px; }
  .cbtn:disabled { opacity: .3; pointer-events: none; }

  /* idle */
  #idle { position: absolute; inset: 0; z-index: 2; display: none; flex-direction: column; align-items: center; justify-content: center;
          gap: 14px; color: var(--text-dim); background: var(--bg); }
  #idle svg { width: 56px; height: 56px; opacity: .5; }
  #idle .t { font-size: 1.2rem; } #idle .s { font-size: .95rem; color: var(--text-dim); }
  body.idle #idle { display: flex; }

  /* compact: 4x1 / 3x1 — art + title + play/skip */
  @media (max-height: 220px) {
    #wrap { padding: 12px 16px; gap: 14px; }
    .art { height: calc(100vh - 24px); }
    .title { font-size: 1.35rem; -webkit-line-clamp: 1; } .artist { font-size: 1rem; margin-top: 2px; } .album, .prog { display: none; }
    .ctrls { margin-top: 10px; gap: 10px; } .cbtn { width: 44px; height: 44px; } .cbtn.play { width: 52px; height: 52px; }
    .source { margin-bottom: 2px; }
  }
  @media (max-width: 900px) and (min-height: 260px) {
    .title { font-size: 1.8rem; } .artist { font-size: 1.2rem; }
    .cbtn { width: 50px; height: 50px; } .cbtn.play { width: 62px; height: 62px; }
  }
</style>
</head>
<body class="idle">
  <div id="glow"></div>
  <div id="wrap">
    <div class="art" id="art">
      <div class="ph" id="artph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/></svg></div>
    </div>
    <div class="right">
      <div class="source"><span class="eq"><i></i><i></i><i></i></span><span id="src">—</span></div>
      <div class="title" id="title">Nothing playing</div>
      <div class="artist" id="artist"></div>
      <div class="album" id="album"></div>
      <div class="prog">
        <div class="bar"><div id="fill"></div></div>
        <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
      </div>
      <div class="ctrls">
        <button class="cbtn" id="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button class="cbtn play" id="play" title="Play/Pause"><svg viewBox="0 0 24 24"><path id="playicon" d="M8 5v14l11-7z"/></svg></button>
        <button class="cbtn" id="next" title="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zm-1.5 6L6 6v12z"/></svg></button>
      </div>
    </div>
  </div>
  <div id="idle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/></svg>
    <div class="t">Nothing playing</div>
    <div class="s" id="idlesrc">Start Spotify or Music to see it here</div>
  </div>

<script>
(function () {
  "use strict";
  var settings = {};
  var $ = function (id) { return document.getElementById(id); };
  var state = { playing: false, positionSec: 0, durationSec: 0, at: 0, artKey: "" };

  var PLAY = "M8 5v14l11-7z";
  var PAUSE = "M6 5h4v14H6zm8 0h4v14h-4z";

  function fmt(s) {
    if (s == null || !isFinite(s) || s < 0) return "0:00";
    s = Math.floor(s); var m = Math.floor(s / 60), ss = s % 60;
    if (m >= 60) { var h = Math.floor(m / 60); m = m % 60; return h + ":" + String(m).padStart(2, "0") + ":" + String(ss).padStart(2, "0"); }
    return m + ":" + String(ss).padStart(2, "0");
  }

  // pull a vivid accent from the album art (downscale to a canvas, average the
  // saturated pixels) so the widget takes on the record's colour.
  function accentFromArt(img) {
    try {
      var c = document.createElement("canvas"); c.width = 24; c.height = 24;
      var ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0, 24, 24);
      var d = ctx.getImageData(0, 0, 24, 24).data;
      var br = 0, bg = 0, bb = 0, bestSat = -1, sr = 0, sg = 0, sb = 0, n = 0;
      for (var i = 0; i < d.length; i += 4) {
        var r = d[i], g = d[i + 1], b = d[i + 2];
        var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        var sat = mx === 0 ? 0 : (mx - mn) / mx, lum = (mx + mn) / 2;
        sr += r; sg += g; sb += b; n++;
        if (sat > bestSat && lum > 40 && lum < 225) { bestSat = sat; br = r; bg = g; bb = b; }
      }
      if (bestSat < 0.18) { br = sr / n; bg = sg / n; bb = sb / n; }   // muted art: use average
      // lift toward a usable accent
      var mx2 = Math.max(br, bg, bb, 1), boost = 200 / mx2;
      if (boost < 1) boost = Math.max(boost, 0.75);
      br = Math.min(255, br * boost); bg = Math.min(255, bg * boost); bb = Math.min(255, bb * boost);
      return "rgb(" + (br | 0) + "," + (bg | 0) + "," + (bb | 0) + ")";
    } catch (e) { return null; }
  }

  function setAccent(col) { document.documentElement.style.setProperty("--accent", col); $("glow").style.background =
    "linear-gradient(100deg, " + col + " -35%, transparent 46%)"; }

  function renderArt(p) {
    var key = p.artworkDataURL || p.artworkURL || "";
    if (key === state.artKey) return;
    state.artKey = key;
    var art = $("art");
    var old = art.querySelector("img"); if (old) old.remove();
    if (!key) { $("artph").style.display = "flex"; if (settings.accentFromArt !== false) setAccent("#1db954"); return; }
    $("artph").style.display = "none";
    var img = new Image();
    img.onload = function () { if (settings.accentFromArt !== false) { var a = accentFromArt(img); if (a) setAccent(a); } };
    img.onerror = function () { $("artph").style.display = "flex"; };
    img.src = key;
    art.appendChild(img);
  }

  function render(p) {
    if (!p || p.available === false || (!p.title && !p.artist)) {
      document.body.classList.remove("playing");
      document.body.classList.add("idle");
      if (p && p.source) $("idlesrc").textContent = p.source + " is open, but nothing is playing";
      state.playing = false;
      return;
    }
    document.body.classList.remove("idle");
    var playing = (p.state || "").toLowerCase() === "playing";
    document.body.classList.toggle("playing", playing);
    state.playing = playing;
    state.positionSec = p.positionSec || 0;
    state.durationSec = p.durationSec || 0;
    state.at = Date.now();

    $("src").textContent = p.source || "Now Playing";
    $("title").textContent = p.title || "—";
    $("artist").textContent = p.artist || "";
    $("album").textContent = p.album || "";
    $("dur").textContent = fmt(state.durationSec);
    $("playicon").setAttribute("d", playing ? PAUSE : PLAY);
    renderArt(p);
    tick();
  }

  // interpolate the progress bar between frames so it moves smoothly
  function tick() {
    var pos = state.positionSec + (state.playing ? (Date.now() - state.at) / 1000 : 0);
    if (state.durationSec > 0) pos = Math.min(pos, state.durationSec);
    $("pos").textContent = fmt(pos);
    var pct = state.durationSec > 0 ? (pos / state.durationSec) : 0;
    $("fill").style.transform = "scaleX(" + Math.max(0, Math.min(1, pct)) + ")";
  }
  setInterval(function () { if (!document.body.classList.contains("idle")) tick(); }, 500);

  function cmd(action, btn) {
    if (!(window.Vardek && Vardek.sendCommand)) return;
    if (btn) { btn.classList.add("press"); setTimeout(function () { btn.classList.remove("press"); }, 140); }
    // optimistic UI for play/pause
    if (action === "playPause") {
      state.positionSec += state.playing ? (Date.now() - state.at) / 1000 : 0;
      state.at = Date.now(); state.playing = !state.playing;
      document.body.classList.toggle("playing", state.playing);
      $("playicon").setAttribute("d", state.playing ? PAUSE : PLAY);
    }
    Vardek.sendCommand("media", action);
  }
  $("prev").addEventListener("click", function () { cmd("previous", $("prev")); });
  $("play").addEventListener("click", function () { cmd("playPause", $("play")); });
  $("next").addEventListener("click", function () { cmd("next", $("next")); });

  function applySettings() {
    settings = (window.Vardek && Vardek.settings) || settings || {};
    document.body.classList.toggle("no-progress", settings.showProgress === false);
  }

  function start() {
    applySettings();
    if (window.Vardek && Vardek.subscribe) Vardek.subscribe("media", render);
  }
  document.addEventListener("vardek:ready", start);
  if (window.Vardek && Vardek.ready) start();
  else setTimeout(function () { if (window.Vardek && Vardek.subscribe) start(); }, 800);
})();
</script>
</body>
</html>
