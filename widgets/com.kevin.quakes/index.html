<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Earthquakes</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0b0e15;--surface:#161b28;--border:#2a3350;--text:#e6e9ef;--mid:#8089a6;--dim:#565f89;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;--err:#f7768e}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
  #wrap{display:flex;flex-direction:column;height:100vh;padding:20px 26px}
  .head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
  .head h1{font-size:1.25rem;font-weight:700}.head h1 .ic{margin-right:8px}
  .head .sub{color:var(--mid);font-size:.95rem}.head .sp{flex:1}
  .head .big{font-family:var(--mono);font-size:.95rem;color:var(--dim)}.head .big b{color:var(--text)}
  .body{flex:1;min-height:0;display:flex;gap:24px}
  .mapwrap{flex:0 0 52%;min-width:0;position:relative;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#0a1a2a}
  .mapwrap canvas{width:100%;height:100%;display:block}
  .list{flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:7px}
  .q{display:grid;grid-template-columns:3.2em 1fr auto;align-items:center;gap:12px;padding:7px 10px;background:var(--surface);border:1px solid var(--border);border-radius:9px}
  .q .mag{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:1.35rem;text-align:center;border-radius:7px;padding:2px 0}
  .q .m{min-width:0}
  .q .pl{font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q .meta{font-family:var(--mono);font-size:.78rem;color:var(--dim);margin-top:1px}
  .q .ago{font-family:var(--mono);font-size:.85rem;color:var(--mid);text-align:right;white-space:nowrap}
  #status{position:fixed;left:26px;bottom:7px;font-family:var(--mono);font-size:.72rem;color:var(--dim)}#status.err{color:var(--err)}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}#boot.hidden{display:none}
  @media(max-width:820px){.body{flex-direction:column}.mapwrap{flex:0 0 40%}}
</style></head>
<body>
  <div id="boot">connecting…</div>
  <div id="wrap" style="display:none">
    <div class="head"><h1><span class="ic">🌎</span>Earthquakes</h1><span class="sub" id="sub"></span><span class="sp"></span><span class="big" id="big"></span></div>
    <div class="body">
      <div class="mapwrap"><canvas id="map"></canvas></div>
      <div class="list" id="list"></div>
    </div>
  </div>
  <div id="status"></div>
<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';
  var settings={feed:"2.5_day",units:"mi"};
  var $=function(i){return document.getElementById(i)}, last=0, quakes=null;
  function magColor(m){return m>=6?"#f7768e":m>=4.5?"#ff9e64":m>=2.5?"#e0af68":"#7dcfff"}
  function ago(t){var s=(Date.now()-t)/1000;if(s<60)return Math.round(s)+"s";if(s<3600)return Math.round(s/60)+"m";if(s<86400)return Math.round(s/3600)+"h";return Math.round(s/86400)+"d"}
  function drawMap(){
    var cv=$("map"),ctx=cv.getContext("2d");
    var dpr=Math.min(window.devicePixelRatio||1,2), W=cv.clientWidth*dpr, H=cv.clientHeight*dpr;
    if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
    ctx.clearRect(0,0,W,H);
    // letterbox the equirectangular map to a 2:1 box so proportions hold at any panel size
    var mapH=Math.min(H,W/2), mapW=mapH*2, ox=(W-mapW)/2, oy=(H-mapH)/2;
    var px=function(lon){return ox+(lon+180)/360*mapW}, py=function(lat){return oy+(90-lat)/180*mapH};
    ctx.strokeStyle="rgba(125,207,255,.10)";ctx.lineWidth=1;
    for(var lon=-180;lon<=180;lon+=30){var x=px(lon);ctx.beginPath();ctx.moveTo(x,oy);ctx.lineTo(x,oy+mapH);ctx.stroke()}
    for(var lat=-60;lat<=60;lat+=30){var y=py(lat);ctx.beginPath();ctx.moveTo(ox,y);ctx.lineTo(ox+mapW,y);ctx.stroke()}
    // equator emphasis
    ctx.strokeStyle="rgba(125,207,255,.22)";ctx.beginPath();var ey=py(0);ctx.moveTo(ox,ey);ctx.lineTo(ox+mapW,ey);ctx.stroke();
    // quakes (oldest first so biggest/newest draw on top)
    var list=(quakes||[]).slice().sort(function(a,b){return a.mag-b.mag});
    list.forEach(function(q){
      var x=px(q.lon), y=py(q.lat), r=Math.max(2.2*dpr,(q.mag+1)*1.8*dpr), c=magColor(q.mag);
      ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=c+"cc";ctx.fill();
      ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.strokeStyle=c;ctx.lineWidth=1*dpr;ctx.stroke();
    });
  }
  function render(){
    var arr=quakes;
    var feedLbl={"1.0_hour":"M1+ · past hour","2.5_day":"M2.5+ · past day","4.5_day":"M4.5+ · past day","all_day":"all · past day","significant_week":"significant · past week"}[settings.feed]||settings.feed;
    $("sub").textContent=feedLbl;
    var mx=arr.reduce(function(a,q){return q.mag>a.mag?q:a},{mag:-9});
    $("big").innerHTML=arr.length+" events · largest <b>M"+(mx.mag>0?mx.mag.toFixed(1):"—")+"</b>";
    var uf=settings.units==="km"?1:0.621371, uu=settings.units;
    $("list").innerHTML=arr.slice(0,7).map(function(q){
      var d=q.depth!=null?Math.round(q.depth*uf)+" "+uu+" deep":"";
      return '<div class="q"><div class="mag" style="color:'+magColor(q.mag)+';background:'+magColor(q.mag)+'22">'+q.mag.toFixed(1)+'</div>'
        +'<div class="m"><div class="pl">'+esc(q.place||"—")+'</div><div class="meta">'+d+'</div></div>'
        +'<div class="ago">'+ago(q.time)+' ago</div></div>';
    }).join("");
    $("boot").classList.add("hidden");$("wrap").style.display="flex";
    drawMap();
  }
  function esc(s){return String(s).replace(/[<>&]/g,function(c){return{"<":"&lt;",">":"&gt;","&":"&amp;"}[c]})}
  async function load(){
    if(Date.now()-last<15000)return; last=Date.now();
    try{
      var url="https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/"+settings.feed+".geojson";
      var res=await xemd.proxy.fetch(url,{headers:{Accept:"application/json"}});
      if(!res.ok)throw new Error("HTTP "+res.status);
      var d=await res.json();
      quakes=(d.features||[]).map(function(f){var c=f.geometry&&f.geometry.coordinates||[0,0,0];
        return{mag:f.properties.mag||0,place:f.properties.place,time:f.properties.time,lon:c[0],lat:c[1],depth:c[2]}})
        .filter(function(q){return q.mag!=null}).sort(function(a,b){return b.time-a.time});
      render();
      $("status").className="";$("status").textContent="USGS · "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    }catch(e){$("status").className="err";$("status").textContent="usgs feed: "+(e.message||e);if(!quakes)$("boot").textContent="earthquake feed unavailable"}
  }
  (async function(){
    try{var s=await Promise.race([xemd.settings.get(),new Promise(function(r){setTimeout(function(){r(null)},1500)})]);if(s)settings=Object.assign(settings,s)}catch(e){}
    xemd.onSettingsChange(function(s){if(s)settings=Object.assign(settings,s);last=0;load()});
    xemd.onRefresh(function(){last=0;load()});xemd.ready();load();setInterval(load,180000);
    window.addEventListener("resize",function(){if(quakes)drawMap()});
  })();
</script></body></html>
