<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>World Population</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0a0f14;--surface:#141d24;--border:#22323c;--text:#e9f2f0;--mid:#8aa0a8;--dim:#556b72;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;--pop:#4ade80;--birth:#6bd08a;--death:#f7768e;--net:#4cc9f0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
  #wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:26px 40px}
  .lab{font-family:var(--mono);font-size:.85rem;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
  .pop{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:5.6rem;line-height:1;color:var(--pop);margin:6px 0 4px}
  .sub{color:var(--mid);font-size:1rem;margin-bottom:24px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
  .stat .k{font-size:.8rem;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
  .stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:2.1rem;margin-top:3px}
  .stat .r{font-family:var(--mono);font-size:.82rem;color:var(--mid);margin-top:2px}
  .stat.b .v{color:var(--birth)}.stat.d .v{color:var(--death)}.stat.n .v{color:var(--net)}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}#boot.hidden{display:none}
</style></head>
<body>
  <div id="wrap" style="display:none">
    <div class="lab">Estimated World Population</div>
    <div class="pop" id="pop">—</div>
    <div class="sub" id="sub"></div>
    <div class="stats">
      <div class="stat b"><div class="k">Births today</div><div class="v" id="births">—</div><div class="r">~4.2 / sec</div></div>
      <div class="stat d"><div class="k">Deaths today</div><div class="v" id="deaths">—</div><div class="r">~2.0 / sec</div></div>
      <div class="stat n"><div class="k">Net growth today</div><div class="v" id="net">—</div><div class="r">~2.2 / sec</div></div>
    </div>
  </div>
  <div id="boot"></div>
<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';
  // Basis: UN World Population Prospects mid-range estimates.
  var EPOCH=Date.UTC(2026,0,1,0,0,0), BASE=8200000000, BIRTHS=4.2, DEATHS=2.0, NET=BIRTHS-DEATHS;
  var $=function(i){return document.getElementById(i)};
  function grp(n){return Math.floor(n).toLocaleString("en-US")}
  function tick(){
    var now=Date.now(), secs=(now-EPOCH)/1000;
    var pop=BASE+secs*NET;
    $("pop").textContent=grp(pop);
    $("sub").textContent="≈ 8.2 billion people · UN mid-range estimate · +"+Math.round(NET*86400).toLocaleString()+"/day";
    var d=new Date(),midnight=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
    var since=(now-midnight)/1000;
    $("births").textContent=grp(since*BIRTHS);
    $("deaths").textContent=grp(since*DEATHS);
    $("net").textContent="+"+grp(since*NET);
  }
  (async function(){
    xemd.ready();$("wrap").style.display="flex";tick();setInterval(tick,120);
  })();
</script></body></html>
