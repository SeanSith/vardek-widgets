<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RSS</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0b0e15;--surface:#161b28;--border:#2a3350;--text:#e6e9ef;--text-mid:#8089a6;--text-dim:#565f89;--accent:#e0af68;--mono:ui-monospace,'SF Mono',Menlo,monospace}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
  #wrap{display:flex;flex-direction:column;height:100vh;padding:18px 22px 10px}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .logo{font-size:1.25rem}.head h1{font-size:1.3rem;font-weight:700}.head .sp{flex:1}.head .upd{font-family:var(--mono);font-size:.78rem;color:var(--text-dim)}
  #list{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:2px 26px;align-content:start}
  #list::-webkit-scrollbar{width:6px}#list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .it{padding:8px;border-radius:8px;cursor:pointer;border-bottom:1px solid rgba(42,51,80,.4)}.it:active{background:var(--surface)}
  .it .t{font-size:1.05rem;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .it .m{font-family:var(--mono);font-size:.8rem;color:var(--text-dim);margin-top:3px}.it .m .src{color:var(--accent)}
  @media(max-width:1200px){#list{grid-template-columns:1fr}}
  #ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--bg);color:var(--text-dim);text-align:center;padding:30px}
  body.loading #ov,body.error #ov{display:flex}body.error #ov{color:#f7768e;font-family:var(--mono);font-size:.9rem}
  .sp2{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style></head>
<body class="loading">
  <div id="wrap"><div class="head"><span class="logo">📡</span><h1>Feed</h1><span class="sp"></span><span class="upd" id="upd">loading…</span></div><div id="list"></div></div>
  <div id="ov"><div class="sp2" id="sp"></div><div id="msg" style="margin-left:14px"></div></div>
<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';
  var settings={feeds:"",count:16}, $=function(i){return document.getElementById(i)}, last=0, cache=null;
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function ago(d){var ms=Date.now()-d;if(isNaN(ms))return"";if(ms<3600000)return Math.max(1,Math.floor(ms/60000))+"m";if(ms<86400000)return Math.floor(ms/3600000)+"h";return Math.floor(ms/86400000)+"d"}
  function domain(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return""}}
  var _dec=document.createElement("textarea");
  function decode(s){for(var i=0;i<2;i++){_dec.innerHTML=s;var v=_dec.value;if(v===s)break;s=v}return s}

  function parseFeed(text, feedUrl) {
    var xml=new DOMParser().parseFromString(text,"text/xml");
    var src=feedUrl;
    var ch=xml.querySelector("channel>title, feed>title"); if(ch)src=ch.textContent.trim();
    if(!src)src=domain(feedUrl);
    var out=[];
    var items=xml.getElementsByTagName("item");
    if(items.length){
      for(var i=0;i<items.length;i++){var it=items[i];
        var link=(it.getElementsByTagName("link")[0]||{}).textContent||"";
        var title=(it.getElementsByTagName("title")[0]||{}).textContent||"";
        var pd=(it.getElementsByTagName("pubDate")[0]||it.getElementsByTagName("dc:date")[0]||{}).textContent||"";
        out.push({title:decode(title.trim()),link:link.trim(),src:decode(src),ts:Date.parse(pd)||0});}
    } else {
      var entries=xml.getElementsByTagName("entry");
      for(var j=0;j<entries.length;j++){var en=entries[j];
        var link="";var ls=en.getElementsByTagName("link");for(var k=0;k<ls.length;k++){var rel=ls[k].getAttribute("rel");if(!rel||rel==="alternate")link=ls[k].getAttribute("href")}
        var title=(en.getElementsByTagName("title")[0]||{}).textContent||"";
        var up=(en.getElementsByTagName("updated")[0]||en.getElementsByTagName("published")[0]||{}).textContent||"";
        out.push({title:decode(title.trim()),link:link,src:decode(src),ts:Date.parse(up)||0});}
    }
    return out;
  }

  function render(items){
    var list=$("list");list.textContent="";
    items.slice(0,Math.min(24,Number(settings.count)||16)).forEach(function(it){
      var el0=el("div","it");
      el0.appendChild(el("div","t",it.title||"(untitled)"));
      var m=el("div","m");m.appendChild(el("span","src",it.src));
      if(it.ts)m.appendChild(document.createTextNode("  ·  "+ago(it.ts)));
      el0.appendChild(m);
      el0.addEventListener("click",function(){if(it.link){try{xemd.openLink(it.link)}catch(e){}}});
      list.appendChild(el0);
    });
  }
  async function load(){
    if(Date.now()-last<8000)return; last=Date.now();
    var feeds=(settings.feeds||"").split(/[,\n]/).map(function(s){return s.trim()}).filter(function(s){return/^https?:/.test(s)}).slice(0,8);
    if(!feeds.length){document.body.className="error";$("sp").style.display="none";$("msg").textContent="Add feed URLs in settings";return}
    try{
      var results=await Promise.all(feeds.map(function(f){
        return xemd.proxy.fetch(f,{headers:{Accept:"application/rss+xml, application/atom+xml, application/xml, text/xml"}})
          .then(function(r){return r.ok?r.text():""}).then(function(t){return t?parseFeed(t,f):[]}).catch(function(){return[]});
      }));
      var all=[].concat.apply([],results).filter(function(x){return x.title});
      all.sort(function(a,b){return (b.ts||0)-(a.ts||0)});
      if(!all.length)throw new Error("no items");
      cache=all;render(all);document.body.className="";
      $("upd").textContent=feeds.length+" feeds · "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    }catch(e){ if(cache){document.body.className="";$("upd").textContent="offline"} else {document.body.className="error";$("sp").style.display="none";$("msg").textContent="RSS error: "+(e.message||e)} }
  }
  (async function(){
    try{var s=await Promise.race([xemd.settings.get(),new Promise(function(r){setTimeout(function(){r(null)},1500)})]);if(s)settings=Object.assign(settings,s)}catch(e){}
    xemd.onSettingsChange(function(s){if(s)settings=Object.assign(settings,s);last=0;load()});
    xemd.onRefresh(function(){last=0;load()});xemd.ready();load();setInterval(load,900000);
  })();
</script></body></html>
