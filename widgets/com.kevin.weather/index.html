<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Weather</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0b0e15;--surface:#161b28;--border:#2a3350;--text:#e6e9ef;--mid:#8089a6;--dim:#565f89;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;--warm:#f0a838;--cool:#7dcfff;--hot:#f7768e}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
  #wrap{display:flex;height:100vh;padding:26px 30px;gap:30px}
  .now{flex:0 0 40%;display:flex;flex-direction:column;justify-content:center;min-width:0}
  .now .place{font-size:1.15rem;color:var(--mid);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now .row{display:flex;align-items:center;gap:14px;margin:2px 0 4px}
  .now .icon{font-size:4.6rem;line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
  .now .temp{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:5rem;line-height:.95}
  .now .cond{font-size:1.4rem;color:var(--text);margin-top:-2px}
  .now .hl{font-family:var(--mono);color:var(--mid);font-size:1.05rem;margin-top:3px}
  .now .hl b{color:var(--text)}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}
  .chip{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 11px;min-width:0}
  .chip .k{font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
  .chip .v{font-family:var(--mono);font-size:1.05rem;font-weight:600;margin-top:1px}
  .week{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
  .day{display:grid;grid-template-columns:2.7em 1.7em 1fr 3.4em;align-items:center;gap:12px;padding:7px 0}
  .day+.day{border-top:1px solid rgba(42,51,80,.5)}
  .day .dn{font-weight:600;font-size:1rem;color:var(--mid)}.day.today .dn{color:var(--text)}
  .day .di{font-size:1.35rem;text-align:center}
  .day .track{position:relative;height:7px;background:rgba(128,137,166,.16);border-radius:4px}
  .day .fill{position:absolute;top:0;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cool),var(--warm))}
  .day .rng{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1rem;text-align:right}
  .day .rng .lo{color:var(--dim)}.day .rng .hi{color:var(--text);font-weight:700}
  #status{position:fixed;left:30px;bottom:8px;font-family:var(--mono);font-size:.72rem;color:var(--dim)}
  #status.err{color:var(--hot)}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}#boot.hidden{display:none}
  @media(max-width:820px){#wrap{flex-direction:column;padding:16px 18px;gap:12px}.now{flex:0 0 auto}.now .temp{font-size:3.4rem}.now .icon{font-size:3rem}}
</style></head>
<body>
  <div id="boot">connecting…</div>
  <div id="wrap" style="display:none">
    <div class="now">
      <div class="place" id="place">—</div>
      <div class="row"><div class="icon" id="icon">·</div><div class="temp" id="temp">—</div></div>
      <div class="cond" id="cond">—</div>
      <div class="hl" id="hl"></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="week" id="week"></div>
  </div>
  <div id="status"></div>
<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';
  var settings={latitude:37.7749,longitude:-122.4194,place:"",units:"fahrenheit"};
  var $=function(i){return document.getElementById(i)}, last=0, data=null;
  var WMO={0:["Clear","☀️","🌙"],1:["Mainly clear","🌤️","🌙"],2:["Partly cloudy","⛅","☁️"],3:["Overcast","☁️","☁️"],
    45:["Fog","🌫️","🌫️"],48:["Rime fog","🌫️","🌫️"],51:["Light drizzle","🌦️","🌦️"],53:["Drizzle","🌦️","🌦️"],55:["Heavy drizzle","🌧️","🌧️"],
    56:["Freezing drizzle","🌧️","🌧️"],57:["Freezing drizzle","🌧️","🌧️"],61:["Light rain","🌦️","🌧️"],63:["Rain","🌧️","🌧️"],65:["Heavy rain","🌧️","🌧️"],
    66:["Freezing rain","🌧️","🌧️"],67:["Freezing rain","🌧️","🌧️"],71:["Light snow","🌨️","🌨️"],73:["Snow","❄️","❄️"],75:["Heavy snow","❄️","❄️"],
    77:["Snow grains","🌨️","🌨️"],80:["Light showers","🌦️","🌧️"],81:["Showers","🌧️","🌧️"],82:["Violent showers","⛈️","⛈️"],
    85:["Snow showers","🌨️","🌨️"],86:["Snow showers","❄️","❄️"],95:["Thunderstorm","⛈️","⛈️"],96:["Thunderstorm+hail","⛈️","⛈️"],99:["Thunderstorm+hail","⛈️","⛈️"]};
  function wmo(code,isDay){var e=WMO[code]||["—","🌡️","🌡️"];return{label:e[0],icon:isDay?e[1]:e[2]}}
  function u(){return settings.units==="celsius"?"C":"F"}
  function dname(iso,i){if(i===0)return"Today";var d=new Date(iso+"T00:00");return d.toLocaleDateString([],{weekday:"short"})}
  function hm(iso){return new Date(iso).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}
  function render(){
    var c=data.current, isDay=c.is_day!==0, w=wmo(c.weather_code,isDay);
    $("place").textContent=settings.place||(Number(settings.latitude).toFixed(2)+", "+Number(settings.longitude).toFixed(2));
    $("icon").textContent=w.icon;
    $("temp").textContent=Math.round(c.temperature_2m)+"°";
    $("cond").textContent=w.label;
    var d0=data.daily;
    $("hl").innerHTML='Feels '+Math.round(c.apparent_temperature)+'°  ·  H:<b>'+Math.round(d0.temperature_2m_max[0])+'°</b> L:<b>'+Math.round(d0.temperature_2m_min[0])+'°</b>';
    var chips=[
      ["Humidity",Math.round(c.relative_humidity_2m)+"%"],
      ["Wind",Math.round(c.wind_speed_10m)+(u()==="F"?" mph":" km/h")],
      ["UV index",Math.round(d0.uv_index_max[0])],
      ["Precip",Math.round((d0.precipitation_probability_max[0]||0))+"%"],
      ["Sunrise",hm(d0.sunrise[0])],
      ["Sunset",hm(d0.sunset[0])]
    ];
    $("chips").innerHTML=chips.map(function(c){return '<div class="chip"><div class="k">'+c[0]+'</div><div class="v">'+c[1]+'</div></div>'}).join("");
    // week
    var days=d0.time.length, gmin=Math.min.apply(null,d0.temperature_2m_min), gmax=Math.max.apply(null,d0.temperature_2m_max), grng=(gmax-gmin)||1;
    var html="";
    for(var i=0;i<Math.min(days,7);i++){
      var lo=d0.temperature_2m_min[i], hi=d0.temperature_2m_max[i], dw=wmo(d0.weather_code[i],true);
      var left=(lo-gmin)/grng*100, width=Math.max(6,(hi-lo)/grng*100);
      html+='<div class="day'+(i===0?' today':'')+'"><div class="dn">'+dname(d0.time[i],i)+'</div>'
        +'<div class="di">'+dw.icon+'</div>'
        +'<div class="track"><div class="fill" style="left:'+left+'%;width:'+width+'%"></div></div>'
        +'<div class="rng"><span class="hi">'+Math.round(hi)+'°</span> <span class="lo">'+Math.round(lo)+'°</span></div></div>';
    }
    $("week").innerHTML=html;
    $("boot").classList.add("hidden");$("wrap").style.display="flex";
  }
  async function load(){
    if(Date.now()-last<20000)return; last=Date.now();
    try{
      var tu=settings.units||"fahrenheit", wu=tu==="celsius"?"kmh":"mph";
      var url="https://api.open-meteo.com/v1/forecast?latitude="+Number(settings.latitude)+"&longitude="+Number(settings.longitude)
        +"&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,weather_code,wind_speed_10m"
        +"&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset"
        +"&forecast_days=7&temperature_unit="+tu+"&wind_speed_unit="+wu+"&timezone=auto";
      var res=await xemd.proxy.fetch(url,{headers:{Accept:"application/json"}});
      if(!res.ok)throw new Error("HTTP "+res.status);
      data=await res.json(); render();
      $("status").className="";$("status").textContent="Open-Meteo · "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    }catch(e){$("status").className="err";$("status").textContent="weather api: "+(e.message||e);if(!data)$("boot").textContent="weather unavailable"}
  }
  (async function(){
    try{var s=await Promise.race([xemd.settings.get(),new Promise(function(r){setTimeout(function(){r(null)},1500)})]);if(s)settings=Object.assign(settings,s)}catch(e){}
    xemd.onSettingsChange(function(s){if(s)settings=Object.assign(settings,s);last=0;load()});
    xemd.onRefresh(function(){last=0;load()});xemd.ready();load();setInterval(load,600000);
  })();
</script></body></html>
