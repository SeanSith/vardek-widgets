<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>arXiv</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0b0e15;--surface:#161b28;--border:#2a3350;--text:#e6e9ef;--text-mid:#8089a6;--text-dim:#565f89;--accent:#b31b1b;--mono:ui-monospace,'SF Mono',Menlo,monospace}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
  #wrap{display:flex;flex-direction:column;height:100vh;padding:18px 22px 10px}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .logo{background:var(--accent);color:#fff;font-weight:800;border-radius:6px;padding:3px 8px;font-size:.95rem;font-family:Georgia,serif}
  .head h1{font-size:1.3rem;font-weight:700}.head .q{font-family:var(--mono);font-size:.8rem;color:var(--accent);border:1px solid rgba(179,27,27,.4);border-radius:6px;padding:2px 8px}
  .head .sp{flex:1}.head .upd{font-family:var(--mono);font-size:.78rem;color:var(--text-dim)}
  #list{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px 26px;align-content:start}
  #list::-webkit-scrollbar{width:6px}#list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .p{padding:8px;border-radius:8px;cursor:pointer}.p:active{background:var(--surface)}
  .p .t{font-size:1.05rem;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .p .m{font-family:var(--mono);font-size:.8rem;color:var(--text-mid);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p .m .cat{color:var(--accent)}.p .m .dt{color:var(--text-dim)}
  @media(max-width:1200px){#list{grid-template-columns:1fr}}
  #ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--bg);color:var(--text-dim);text-align:center;padding:30px}
  body.loading #ov,body.error #ov{display:flex}body.error #ov{color:#f7768e;font-family:var(--mono);font-size:.9rem}
  .sp2{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style></head>
<body class="loading">
  <div id="wrap"><div class="head"><span class="logo">arXiv</span><h1>Latest</h1><span class="q" id="q"></span><span class="sp"></span><span class="upd" id="upd">loading…</span></div><div id="list"></div></div>
  <div id="ov"><div class="sp2" id="sp"></div><div id="msg" style="margin-left:14px"></div></div>
<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';
  var settings={query:"cat:cs.AI",count:12}, $=function(i){return document.getElementById(i)}, last=0, cache=null;
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function render(entries){
    var list=$("list");list.textContent="";
    entries.slice(0,Math.min(20,Number(settings.count)||12)).forEach(function(en){
      var p=el("div","p");
      p.appendChild(el("div","t",en.title));
      var m=el("div","m");
      m.appendChild(el("span","cat",en.cat||"arXiv"));
      m.appendChild(document.createTextNode("  "+en.authors));
      m.appendChild(el("span","dt","  ·  "+en.date));
      p.appendChild(m);
      p.addEventListener("click",function(){try{xemd.openLink(en.link)}catch(e){}});
      list.appendChild(p);
    });
  }
  async function load(){
    if(Date.now()-last<5000)return; last=Date.now();
    $("q").textContent=settings.query;
    try{
      var url="https://export.arxiv.org/api/query?search_query="+encodeURIComponent(settings.query)+"&sortBy=submittedDate&sortOrder=descending&max_results="+Math.min(20,Number(settings.count)||12);
      var res=await xemd.proxy.fetch(url,{headers:{Accept:"application/atom+xml"}});
      if(!res.ok)throw new Error("HTTP "+res.status);
      var xml=new DOMParser().parseFromString(await res.text(),"text/xml");
      var ents=[].slice.call(xml.getElementsByTagName("entry")).map(function(e){
        var g=function(t){var n=e.getElementsByTagName(t);return n.length?n[0].textContent.trim():""};
        var auth=[].slice.call(e.getElementsByTagName("author")).map(function(a){var n=a.getElementsByTagName("name");return n.length?n[0].textContent:""}).filter(Boolean);
        var cat=e.getElementsByTagName("arxiv:primary_category")[0]||e.getElementsByTagName("category")[0];
        var link="";var links=e.getElementsByTagName("link");for(var i=0;i<links.length;i++){if(links[i].getAttribute("rel")==="alternate")link=links[i].getAttribute("href")}
        return {title:g("title").replace(/\s+/g," "),authors:auth.slice(0,3).join(", ")+(auth.length>3?" +"+(auth.length-3):""),
                date:(g("published")||"").slice(0,10),cat:cat?cat.getAttribute("term"):"",link:link||g("id")};
      });
      if(!ents.length)throw new Error("no results");
      cache=ents;render(ents);document.body.className="";
      $("upd").textContent="updated "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    }catch(e){ if(cache){document.body.className="";$("upd").textContent="offline"} else {document.body.className="error";$("sp").style.display="none";$("msg").textContent="arXiv error: "+(e.message||e)} }
  }
  (async function(){
    try{var s=await Promise.race([xemd.settings.get(),new Promise(function(r){setTimeout(function(){r(null)},1500)})]);if(s)settings=Object.assign(settings,s)}catch(e){}
    xemd.onSettingsChange(function(s){if(s)settings=Object.assign(settings,s);last=0;load()});
    xemd.onRefresh(function(){last=0;load()});xemd.ready();load();setInterval(load,900000);
  })();
</script></body></html>
