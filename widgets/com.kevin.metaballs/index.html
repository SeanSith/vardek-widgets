<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Metaballs</title>
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#000}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';
  var settings={palette:"lava",blobs:7};
  // palette: array of [t,r,g,b] color stops for field value 0..1
  var PAL={
    lava:[[0,8,2,10],[0.55,120,10,20],[0.72,220,60,10],[0.85,250,150,20],[1,255,240,150]],
    ocean:[[0,2,6,16],[0.55,10,40,90],[0.72,20,120,180],[0.85,60,200,220],[1,200,250,255]],
    toxic:[[0,4,10,4],[0.55,20,80,20],[0.72,80,180,30],[0.85,160,230,40],[1,230,255,180]],
    plasma:[[0,10,2,20],[0.55,80,20,120],[0.72,170,40,180],[0.85,240,80,180],[1,255,210,240]],
    mono:[[0,4,5,8],[0.55,40,45,60],[0.72,110,120,140],[0.85,180,190,205],[1,245,248,255]]};
  var cv=document.getElementById("c"),ctx=cv.getContext("2d");
  var off=document.createElement("canvas"),octx=off.getContext("2d"),oimg;
  var W,H,dpr,scale,fw,fh,balls=[];
  function rnd(a,b){return a+Math.random()*(b-a)}
  function build(){
    var n=Math.max(3,Math.min(16,Math.round(Number(settings.blobs)||7)));balls=[];
    for(var i=0;i<n;i++)balls.push({x:Math.random()*W,y:Math.random()*H,vx:rnd(-1.4,1.4)*dpr,vy:rnd(-1.4,1.4)*dpr,r:rnd(0.05,0.11)*Math.min(W,H)});
  }
  function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=Math.round(cv.clientWidth*dpr);H=Math.round(cv.clientHeight*dpr);cv.width=W;cv.height=H;
    scale=Math.max(3,Math.round(4*dpr));fw=Math.ceil(W/scale);fh=Math.ceil(H/scale);off.width=fw;off.height=fh;oimg=octx.createImageData(fw,fh);build()}
  function col(pal,t){for(var i=1;i<pal.length;i++){if(t<=pal[i][0]){var a=pal[i-1],b=pal[i],f=(t-a[0])/((b[0]-a[0])||1);
    return [a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f,a[3]+(b[3]-a[3])*f]}}var l=pal[pal.length-1];return [l[1],l[2],l[3]]}
  function frame(){
    // move balls
    for(var i=0;i<balls.length;i++){var b=balls[i];b.x+=b.vx;b.y+=b.vy;
      if(b.x<0||b.x>W)b.vx*=-1;if(b.y<0||b.y>H)b.vy*=-1;b.x=Math.max(0,Math.min(W,b.x));b.y=Math.max(0,Math.min(H,b.y));}
    var pal=PAL[settings.palette]||PAL.lava,data=oimg.data,thr=1.0;
    for(var y=0;y<fh;y++){var wy=y*scale;for(var x=0;x<fw;x++){var wx=x*scale,sum=0;
      for(var k=0;k<balls.length;k++){var bb=balls[k],dx=wx-bb.x,dy=wy-bb.y;sum+=(bb.r*bb.r)/(dx*dx+dy*dy+1)}
      var t=Math.min(1,Math.max(0,(sum-0.55)/1.3));var c=col(pal,t);var o=(y*fw+x)*4;
      data[o]=c[0];data[o+1]=c[1];data[o+2]=c[2];data[o+3]=255;}}
    octx.putImageData(oimg,0,0);
    ctx.imageSmoothingEnabled=true;ctx.drawImage(off,0,0,fw,fh,0,0,W,H);
    requestAnimationFrame(frame);
  }
  (async function(){
    try{var s=await Promise.race([xemd.settings.get(),new Promise(function(r){setTimeout(function(){r(null)},1500)})]);if(s)settings=Object.assign(settings,s)}catch(e){}
    xemd.onSettingsChange(function(s){if(s)settings=Object.assign(settings,s);build()});
    xemd.ready();resize();requestAnimationFrame(frame);window.addEventListener("resize",resize);
  })();
</script></body></html>
