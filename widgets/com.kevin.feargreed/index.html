<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fear & Greed</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0b0e15;--surface:#161b28;--border:#2a3350;--text:#e6e9ef;--mid:#8089a6;--dim:#565f89;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;--err:#f7768e}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
  #wrap{display:flex;height:100vh;padding:26px 32px;gap:36px;align-items:center}
  .gauge{flex:0 0 44%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-width:0}
  .gauge canvas{width:100%;max-width:380px;height:auto}
  .gauge .ctr{position:absolute;top:48%;left:0;right:0;text-align:center;pointer-events:none}
  .gauge .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:5rem;line-height:1}
  .gauge .cls{font-size:1.4rem;font-weight:600;margin-top:2px}
  .gauge .cap{color:var(--dim);font-size:.95rem;margin-top:8px}
  .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
  .side h2{font-size:.82rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
  .spark{height:70px}.spark canvas{width:100%;height:70px;display:block}
  .rows{display:flex;flex-direction:column;gap:2px}
  .r{display:flex;align-items:center;gap:14px;padding:8px 0}
  .r+.r{border-top:1px solid rgba(42,51,80,.5)}
  .r .lab{flex:1;color:var(--mid);font-size:1rem}
  .r .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.4rem;font-weight:700;width:2.2em;text-align:right}
  .r .cl{font-size:.9rem;width:9em;text-align:right}
  #status{position:fixed;left:32px;bottom:8px;font-family:var(--mono);font-size:.72rem;color:var(--dim)}#status.err{color:var(--err)}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}#boot.hidden{display:none}
  @media(max-width:820px){#wrap{flex-direction:column;padding:16px;gap:14px}.gauge{flex:0 0 auto}}
</style></head>
<body>
  <div id="boot">connecting…</div>
  <div id="wrap" style="display:none">
    <div class="gauge"><canvas id="g" width="380" height="240"></canvas>
      <div class="ctr"><div class="val" id="val">—</div><div class="cls" id="cls"></div></div>
      <div class="cap">Crypto Fear &amp; Greed Index</div>
    </div>
    <div class="side">
      <div><h2>Last 30 days</h2><div class="spark"><canvas id="sp"></canvas></div></div>
      <div class="rows" id="rows"></div>
    </div>
  </div>
  <div id="status"></div>
<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';
  var $=function(i){return document.getElementById(i)}, last=0, data=null;
  var ZONES=[[0,24,"Extreme Fear","#f7768e"],[25,44,"Fear","#ff9e64"],[45,55,"Neutral","#e0af68"],[56,74,"Greed","#9ece6a"],[75,100,"Extreme Greed","#3ddc97"]];
  function zone(v){for(var i=0;i<ZONES.length;i++)if(v<=ZONES[i][1])return ZONES[i];return ZONES[ZONES.length-1]}
  function drawGauge(v){
    var cv=$("g"),ctx=cv.getContext("2d"),W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);
    var cx=W/2,cy=H-20,r=W/2-24,lw=24,a0=Math.PI;
    ZONES.forEach(function(z){var f0=z[0]/100,f1=(z[1]+1)/100;if(z[1]===100)f1=1;
      ctx.beginPath();ctx.strokeStyle=z[3];ctx.lineWidth=lw;ctx.arc(cx,cy,r,a0+f0*Math.PI,a0+f1*Math.PI);ctx.stroke()});
    var f=Math.max(0,Math.min(1,v/100)),ang=a0+f*Math.PI,nx=cx+Math.cos(ang)*(r+2),ny=cy+Math.sin(ang)*(r+2);
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(nx,ny);ctx.strokeStyle="#e6e9ef";ctx.lineWidth=3;ctx.lineCap="round";ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,6,0,7);ctx.fillStyle="#e6e9ef";ctx.fill();
  }
  function drawSpark(series){
    var cv=$("sp"),ctx=cv.getContext("2d"),dpr=Math.min(window.devicePixelRatio||1,2);
    var W=Math.round(cv.clientWidth*dpr),H=Math.round(cv.clientHeight*dpr);if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
    ctx.clearRect(0,0,W,H);if(series.length<2)return;var pad=6*dpr;
    // zone bands faint
    var bands=[[0,25,"#f7768e"],[25,45,"#ff9e64"],[45,56,"#e0af68"],[56,75,"#9ece6a"],[75,100,"#3ddc97"]];
    bands.forEach(function(b){var y0=H-pad-b[1]/100*(H-2*pad),y1=H-pad-b[0]/100*(H-2*pad);ctx.fillStyle=b[2]+"12";ctx.fillRect(0,y0,W,y1-y0)});
    var xy=function(i){return[pad+i/(series.length-1)*(W-2*pad),H-pad-series[i]/100*(H-2*pad)]};
    ctx.beginPath();series.forEach(function(_,i){var p=xy(i);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])});
    ctx.strokeStyle="#e6e9ef";ctx.lineWidth=1.8*dpr;ctx.lineJoin="round";ctx.stroke();
    var lp=xy(series.length-1);ctx.beginPath();ctx.arc(lp[0],lp[1],3*dpr,0,7);ctx.fillStyle=zone(series[series.length-1])[3];ctx.fill();
  }
  function render(){
    var arr=data;var nowv=+arr[0].value,z=zone(nowv);
    $("val").textContent=nowv;$("val").style.color=z[3];$("cls").textContent=z[2];$("cls").style.color=z[3];
    drawGauge(nowv);
    var series=arr.slice().reverse().map(function(x){return +x.value});
    $("boot").classList.add("hidden");$("wrap").style.display="flex";
    drawSpark(series);
    function pick(i){return arr[i]?{v:+arr[i].value,z:zone(+arr[i].value)}:null}
    var refs=[["Now",pick(0)],["Yesterday",pick(1)],["Last week",pick(7)],["Last month",pick(arr.length-1)]];
    $("rows").innerHTML=refs.filter(function(r){return r[1]}).map(function(r){
      return '<div class="r"><span class="lab">'+r[0]+'</span><span class="v" style="color:'+r[1].z[3]+'">'+r[1].v+'</span><span class="cl" style="color:'+r[1].z[3]+'">'+r[1].z[2]+'</span></div>';
    }).join("");
  }
  async function load(){
    if(Date.now()-last<30000)return; last=Date.now();
    try{
      var res=await xemd.proxy.fetch("https://api.alternative.me/fng/?limit=31",{headers:{Accept:"application/json"}});
      if(!res.ok)throw new Error("HTTP "+res.status);
      var d=await res.json();data=d.data||[];if(!data.length)throw new Error("no data");
      render();
      $("status").className="";$("status").textContent="alternative.me · "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    }catch(e){$("status").className="err";$("status").textContent="f&g api: "+(e.message||e);if(!data)$("boot").textContent="index unavailable"}
  }
  (async function(){
    xemd.onRefresh(function(){last=0;load()});xemd.ready();load();setInterval(load,1800000);
    window.addEventListener("resize",function(){if(data){var s=data.slice().reverse().map(function(x){return +x.value});drawSpark(s)}});
  })();
</script></body></html>
