<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trivia</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0b0e15;--surface:#161b28;--border:#2a3350;--text:#e6e9ef;--mid:#8089a6;--dim:#565f89;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;--ok:#9ece6a;--easy:#9ece6a;--med:#e0af68;--hard:#f7768e;--accent:#7aa2f7}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
  #wrap{display:flex;flex-direction:column;height:100vh;padding:26px 34px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .cat{font-size:.95rem;color:var(--mid)}.sp{flex:1}
  .badge{font-family:var(--mono);font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase}
  .badge.easy{background:rgba(158,206,106,.16);color:var(--easy)}.badge.medium{background:rgba(224,175,104,.16);color:var(--med)}.badge.hard{background:rgba(247,118,142,.16);color:var(--hard)}
  .q{font-size:2rem;font-weight:700;line-height:1.25;margin:12px 0 18px;flex:0 0 auto}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;align-content:center}
  .opt{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;font-size:1.25rem;transition:background .3s,border-color .3s,opacity .3s}
  .opt .k{font-family:var(--mono);font-weight:800;color:var(--accent);width:1.4em;flex-shrink:0}
  .opt .t{min-width:0}
  .opt.correct{background:rgba(158,206,106,.16);border-color:var(--ok)}.opt.correct .k{color:var(--ok)}
  .opt.dim{opacity:.4}
  .bar{height:4px;background:var(--surface);border-radius:2px;margin-top:16px;overflow:hidden}
  .bar>div{height:100%;background:var(--accent);transform-origin:left;width:100%}
  #status{position:fixed;left:34px;bottom:7px;font-family:var(--mono);font-size:.72rem;color:var(--dim)}#status.err{color:var(--hard)}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}#boot.hidden{display:none}
</style></head>
<body>
  <div id="boot">connecting…</div>
  <div id="wrap" style="display:none">
    <div class="top"><span class="cat" id="cat"></span><span class="sp"></span><span class="badge" id="diff"></span></div>
    <div class="q" id="q"></div>
    <div class="opts" id="opts"></div>
    <div class="bar"><div id="barfill"></div></div>
  </div>
  <div id="status"></div>
<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';
  var settings={difficulty:"any",revealSec:9};
  var $=function(i){return document.getElementById(i)}, queue=[], busy=false, t1=null,t2=null;
  var ta=document.createElement("textarea");
  function dec(s){ta.innerHTML=String(s||"");return ta.value}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  async function fetchBatch(){
    var url="https://opentdb.com/api.php?amount=10&type=multiple"+(settings.difficulty&&settings.difficulty!=="any"?"&difficulty="+settings.difficulty:"");
    var res=await xemd.proxy.fetch(url,{headers:{Accept:"application/json"}});
    if(!res.ok)throw new Error("HTTP "+res.status);
    var d=await res.json();queue=queue.concat(d.results||[]);
  }
  function showQuestion(item){
    var opts=shuffle(item.incorrect_answers.concat([item.correct_answer]).map(function(x){return dec(x)}));
    var correct=dec(item.correct_answer);
    $("cat").textContent=dec(item.category);
    $("diff").textContent=item.difficulty;$("diff").className="badge "+item.difficulty;
    $("q").textContent=dec(item.question);
    var keys=["A","B","C","D"];
    $("opts").innerHTML=opts.map(function(o,i){return '<div class="opt" data-o="'+encodeURIComponent(o)+'"><span class="k">'+keys[i]+'</span><span class="t">'+o.replace(/[<>&]/g,function(c){return{"<":"&lt;",">":"&gt;","&":"&amp;"}[c]})+'</span></div>'}).join("");
    // timer bar
    var bf=$("barfill");bf.style.transition="none";bf.style.transform="scaleX(1)";void bf.offsetWidth;
    var rev=Math.max(4,Number(settings.revealSec)||9);
    bf.style.transition="transform "+rev+"s linear";bf.style.transform="scaleX(0)";
    $("boot").classList.add("hidden");$("wrap").style.display="flex";
    t1=setTimeout(function(){
      // reveal
      Array.prototype.forEach.call($("opts").children,function(el){
        var o=decodeURIComponent(el.getAttribute("data-o"));
        if(o===correct)el.classList.add("correct");else el.classList.add("dim");
      });
      t2=setTimeout(next,3500);
    },rev*1000);
  }
  async function next(){
    if(busy)return;busy=true;
    try{
      if(!queue.length)await fetchBatch();
      var item=queue.shift();
      busy=false;
      if(item)showQuestion(item);
      $("status").className="";$("status").textContent="Open Trivia DB";
    }catch(e){busy=false;$("status").className="err";$("status").textContent="trivia api: "+(e.message||e);if($("wrap").style.display==="none")$("boot").textContent="trivia unavailable";t2=setTimeout(next,8000)}
  }
  (async function(){
    try{var s=await Promise.race([xemd.settings.get(),new Promise(function(r){setTimeout(function(){r(null)},1500)})]);if(s)settings=Object.assign(settings,s)}catch(e){}
    xemd.onSettingsChange(function(s){if(s)settings=Object.assign(settings,s)});
    xemd.ready();next();
  })();
</script></body></html>
