<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #0b0e15; --surface: #161b28; --border: #2a3350; --text: #e6e9ef; --text-mid: #8089a6; --text-dim: #565f89;
          --up: #9ece6a; --down: #f7768e; --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
               font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }
  #list { display: grid; height: 100vh; gap: 12px; padding: 16px; }
  .coin { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px;
          display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; gap: 2px 12px; align-items: center; position: relative; overflow: hidden; }
  .coin .sym { font-weight: 700; font-size: 1.15rem; letter-spacing: .02em; }
  .coin .sym .nm { color: var(--text-dim); font-weight: 500; font-size: .8rem; margin-left: 8px; text-transform: capitalize; }
  .coin .price { grid-row: 1 / 3; grid-column: 2; text-align: right; }
  .coin .price .p { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.5rem; }
  .coin .price .ch { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .95rem; margin-top: 2px; }
  .coin .ch.up, .coin .p.up { color: var(--up); } .coin .ch.down { color: var(--down); }
  .coin canvas { grid-row: 2; grid-column: 1; width: 100%; height: 26px; }
  .err { grid-column: 1 / -1; align-self: center; text-align: center; color: var(--text-dim); font-family: var(--mono); font-size: .85rem; padding: 20px; }
  #status { position: absolute; left: 18px; bottom: 6px; font-family: var(--mono); font-size: .72rem; color: var(--text-dim); }
</style>
</head>
<body>
  <div id="list"></div>
  <div id="status"></div>
<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';
  var settings = { coins: "bitcoin,ethereum,solana,cardano", currency: "usd" };
  var $ = function (id) { return document.getElementById(id); };
  var list = $("list"), data = [], lastFetch = 0, cur = "usd";
  var SYM = { usd: "$", eur: "€", gbp: "£", jpy: "¥", btc: "₿" };

  function fmtPrice(v) {
    var s = SYM[cur] || "";
    if (v == null) return "—";
    if (v >= 1000) return s + v.toLocaleString("en-US", { maximumFractionDigits: 0 });
    if (v >= 1) return s + v.toLocaleString("en-US", { maximumFractionDigits: 2 });
    return s + v.toLocaleString("en-US", { maximumFractionDigits: 6 });
  }

  function layout(n) {
    var cw = list.clientWidth, ch = list.clientHeight;
    var cols = ch < 200 ? Math.min(n, 4) : (cw / ch >= 1.7 ? Math.min(n, 2) : 1);
    var rows = Math.ceil(n / cols);
    list.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
    list.style.gridTemplateRows = "repeat(" + rows + ", 1fr)";
  }

  function spark(canvas, pts, up) {
    if (!pts || pts.length < 2) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    var ctx = canvas.getContext("2d"); ctx.clearRect(0, 0, w, h);
    var mn = Math.min.apply(null, pts), mx = Math.max.apply(null, pts), rng = mx - mn || 1;
    ctx.beginPath();
    pts.forEach(function (p, i) { var x = i / (pts.length - 1) * w, y = h - (p - mn) / rng * (h - 3 * dpr) - 1.5 * dpr; i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
    ctx.strokeStyle = up ? "#9ece6a" : "#f7768e"; ctx.lineWidth = 1.5 * dpr; ctx.lineJoin = "round"; ctx.stroke();
    ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
    ctx.fillStyle = up ? "rgba(158,206,106,.10)" : "rgba(247,118,142,.10)"; ctx.fill();
  }

  function render() {
    list.innerHTML = "";
    if (!data.length) { list.innerHTML = '<div class="err">No coins — set CoinGecko ids in settings</div>'; return; }
    layout(data.length);
    data.forEach(function (c) {
      var up = (c.price_change_percentage_24h || 0) >= 0;
      var el = document.createElement("div"); el.className = "coin";
      el.innerHTML =
        '<div class="sym">' + (c.symbol || "").toUpperCase() + '<span class="nm">' + esc(c.name || "") + '</span></div>' +
        '<canvas></canvas>' +
        '<div class="price"><div class="p">' + fmtPrice(c.current_price) + '</div>' +
        '<div class="ch ' + (up ? "up" : "down") + '">' + (up ? "▲ " : "▼ ") + Math.abs(c.price_change_percentage_24h || 0).toFixed(2) + '%</div></div>';
      list.appendChild(el);
      var pts = (c.sparkline_in_7d || {}).price || [];
      spark(el.querySelector("canvas"), pts, up);
    });
  }
  function esc(s) { return String(s).replace(/[<>&]/g, function (c) { return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]; }); }

  async function fetchData() {
    if (Date.now() - lastFetch < 30000) return;
    cur = (settings.currency || "usd").toLowerCase();
    var ids = (settings.coins || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 12).join(",");
    if (!ids) { data = []; render(); return; }
    try {
      var url = "https://api.coingecko.com/api/v3/coins/markets?vs_currency=" + cur + "&ids=" + ids + "&sparkline=true&price_change_percentage=24h";
      var res = await xemd.proxy.fetch(url, { headers: { Accept: "application/json" } });
      if (!res.ok) throw new Error("HTTP " + res.status);
      var arr = await res.json();
      // preserve the user's ordering
      var order = ids.split(",");
      arr.sort(function (a, b) { return order.indexOf(a.id) - order.indexOf(b.id); });
      data = arr; lastFetch = Date.now(); render();
      $("status").textContent = "updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + " · CoinGecko";
    } catch (e) {
      if (!data.length) { list.innerHTML = '<div class="err">CoinGecko error: ' + esc(e.message || "fetch failed") + '</div>'; }
      $("status").textContent = "offline";
    }
  }

  (async function () {
    try { var s = await Promise.race([xemd.settings.get(), new Promise(function (r) { setTimeout(function () { r(null); }, 1500); })]); if (s) settings = Object.assign(settings, s); } catch (e) {}
    xemd.onSettingsChange(function (s) { if (s) settings = Object.assign(settings, s); lastFetch = 0; fetchData(); });
    xemd.onRefresh(function () { lastFetch = 0; fetchData(); });
    xemd.ready();
    fetchData(); setInterval(fetchData, 60000);
    window.addEventListener("resize", render);
  })();
</script>
</body>
</html>
