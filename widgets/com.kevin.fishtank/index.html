<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fish Tank</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04141f;
               font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }

  /* status (tank name, counts, peers, recent events) */
  #status { position: absolute; left: 16px; top: 14px; color: #cfeaffcc; font-size: 12px;
            text-shadow: 0 1px 3px rgba(0,0,0,.6); max-width: 46%; }
  #status .name { font-size: 19px; font-weight: 700; letter-spacing: .02em; line-height: 1.1; }
  #status .sub { font-family: ui-monospace, Menlo, monospace; font-size: 12px; opacity: .85; margin-top: 2px; }
  #status .peers { font-family: ui-monospace, Menlo, monospace; font-size: 12px; opacity: .8; margin-top: 3px; }
  #status .peers b { color: #8fe3ff; font-weight: 600; }
  #events { position: absolute; right: 16px; top: 14px; text-align: right; font-family: ui-monospace, Menlo, monospace;
            font-size: 12px; color: #bfe6ffcc; text-shadow: 0 1px 3px rgba(0,0,0,.6); max-width: 46%; }
  #events div { margin: 1px 0; opacity: 0; animation: fadein .5s forwards; }
  #events .go { color: #ffd9a0; } #events .come { color: #a8f0c0; }
  @keyframes fadein { to { opacity: .92; } }
  body.no-status #status, body.no-status #events { display: none; }

  /* inspect card */
  #card { position: absolute; pointer-events: none; min-width: 200px; background: rgba(6,16,26,.92);
          border: 1px solid #1d3a52; border-radius: 12px; padding: 12px 14px; color: #e6f3ff; font-size: 13px;
          box-shadow: 0 8px 30px rgba(0,0,0,.5); display: none; z-index: 5; }
  #card.on { display: block; }
  #card .cn { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  #card .row { display: flex; justify-content: space-between; gap: 16px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; opacity: .9; }
  #card .row span:first-child { color: #7fb2d6; }
  #card .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

  #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
          color: #4a6a80; font-size: 15px; }
  #boot.hidden { display: none; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="status"><div class="name">Fish Tank</div><div class="sub"></div><div class="peers"></div></div>
    <div id="events"></div>
    <div id="card"></div>
  </div>
  <div id="boot">Waiting for the tank…</div>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  var settings = { showNames: true, showStatus: true, tapToInspect: true };
  var W = 0, H = 0, dpr = 1;
  var fishMap = {};          // id -> live fish sprite (position/physics + attrs)
  var data = null, lastGen = null;
  var bubbles = [], plants = [];
  var selected = null, selectUntil = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.round(canvas.clientWidth * dpr));
    var h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h; W = w; H = h; buildScene();
    }
  }
  function rnd(a, b) { return a + Math.random() * (b - a); }

  function buildScene() {
    bubbles = [];
    for (var i = 0; i < Math.round(W / dpr / 60); i++)
      bubbles.push({ x: Math.random() * W, y: Math.random() * H, r: rnd(1, 3) * dpr, sp: rnd(12, 34) * dpr });
    plants = [];
    var n = Math.round(W / dpr / 130);
    for (var j = 0; j < n; j++) {
      var px = (j + 0.5) / n * W + rnd(-40, 40) * dpr;
      plants.push({ x: px, h: rnd(0.28, 0.55) * H, blades: Math.round(rnd(3, 6)), hue: rnd(120, 165), ph: Math.random() * 6 });
    }
  }

  // ── scene ───────────────────────────────────────────────────────────
  function drawWater(t) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0a3b52"); g.addColorStop(0.5, "#083046"); g.addColorStop(1, "#04141f");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // caustic light shafts from the surface
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < 5; i++) {
      var x = (i / 5 + 0.06 * Math.sin(t * 0.2 + i)) * W;
      var w = W * 0.09;
      var lg = ctx.createLinearGradient(x, 0, x + w, H);
      lg.addColorStop(0, "rgba(120,200,235,0.06)"); lg.addColorStop(1, "rgba(120,200,235,0)");
      ctx.fillStyle = lg; ctx.beginPath();
      ctx.moveTo(x, 0); ctx.lineTo(x + w, 0); ctx.lineTo(x + w * 0.4 + W * 0.12, H); ctx.lineTo(x - W * 0.05, H); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // sandy floor
    var fg = ctx.createLinearGradient(0, H * 0.86, 0, H);
    fg.addColorStop(0, "rgba(60,80,70,0)"); fg.addColorStop(1, "rgba(40,54,44,0.6)");
    ctx.fillStyle = fg; ctx.fillRect(0, H * 0.86, W, H * 0.14);
  }
  function drawPlants(t) {
    plants.forEach(function (p) {
      for (var b = 0; b < p.blades; b++) {
        var bx = p.x + (b - p.blades / 2) * 7 * dpr;
        var sway = Math.sin(t * 1.1 + p.ph + b) * 12 * dpr;
        ctx.beginPath(); ctx.moveTo(bx, H);
        ctx.quadraticCurveTo(bx + sway * 0.5, H - p.h * 0.6, bx + sway, H - p.h);
        ctx.lineWidth = (3 + (b % 2)) * dpr; ctx.strokeStyle = "hsla(" + p.hue + ",45%,32%,0.8)";
        ctx.lineCap = "round"; ctx.stroke();
      }
    });
  }
  function drawBubbles(dt) {
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    bubbles.forEach(function (b) {
      b.y -= b.sp * dt; b.x += Math.sin(b.y * 0.02) * 0.3 * dpr;
      if (b.y < -b.r) { b.y = H + b.r; b.x = Math.random() * W; }
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7);
      ctx.strokeStyle = "rgba(180,225,245,0.28)"; ctx.lineWidth = 1 * dpr; ctx.stroke();
    });
    ctx.restore();
  }

  // ── a procedurally-drawn fish from its attributes ───────────────────
  var SHAPE = {
    guppy: [1.9, 0.9], betta: [1.6, 1.05], angelfish: [1.35, 1.5], goldfish: [1.7, 1.1],
    tetra: [2.1, 0.8], clownfish: [1.8, 0.95], koi: [2.4, 0.8], discus: [1.25, 1.4],
    molly: [1.9, 0.95], gourami: [1.7, 1.1]
  };
  function drawFish(f, t) {
    var L = f.baseLen * (0.9 + 0.1 * Math.sin(t)); // subtle breathing
    var sh = SHAPE[f.species] || [1.8, 1.0];
    var bl = L, bh = L * (sh[1] / sh[0]);
    var col = "hsl(" + f.hue + "," + f.sat + "%,55%)";
    var dark = "hsl(" + f.hue + "," + f.sat + "%,38%)";
    var light = "hsl(" + f.hue + "," + Math.min(100, f.sat + 10) + "%,68%)";
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.tilt);
    ctx.scale(f.dir, 1);                 // face travel direction
    var wig = Math.sin(t * 6 * f.speed + f.phase);

    // tail
    ctx.beginPath();
    var tx = -bl * 0.5, ty = wig * bh * 0.35;
    ctx.moveTo(tx, 0);
    ctx.quadraticCurveTo(tx - bl * 0.35, ty - bh * 0.5, tx - bl * 0.5, ty - bh * 0.55);
    ctx.quadraticCurveTo(tx - bl * 0.3, ty, tx - bl * 0.5, ty + bh * 0.55);
    ctx.quadraticCurveTo(tx - bl * 0.35, ty + bh * 0.5, tx, 0);
    ctx.fillStyle = dark; ctx.fill();

    // dorsal + pelvic fins
    ctx.fillStyle = f.fin === "flowing" ? light : dark;
    ctx.beginPath(); ctx.moveTo(bl * 0.05, -bh * 0.45);
    ctx.quadraticCurveTo(-bl * 0.1, -bh * (f.fin === "spiky" ? 1.0 : 0.8), -bl * 0.25, -bh * 0.4);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bl * 0.05, bh * 0.42);
    ctx.quadraticCurveTo(-bl * 0.05, bh * 0.8, -bl * 0.2, bh * 0.4); ctx.closePath(); ctx.fill();

    // body
    ctx.beginPath(); ctx.ellipse(0, 0, bl * 0.5, bh * 0.5, 0, 0, 7);
    var bg = ctx.createLinearGradient(0, -bh * 0.5, 0, bh * 0.5);
    bg.addColorStop(0, light); bg.addColorStop(0.5, col); bg.addColorStop(1, dark);
    ctx.fillStyle = bg; ctx.fill();

    // pattern (clipped to body)
    ctx.save(); ctx.clip();
    if (f.pattern === "striped") {
      ctx.strokeStyle = dark; ctx.lineWidth = bl * 0.06;
      for (var s = -3; s <= 3; s++) { ctx.beginPath(); ctx.moveTo(s * bl * 0.16, -bh); ctx.lineTo(s * bl * 0.16 - bl * 0.1, bh); ctx.stroke(); }
    } else if (f.pattern === "spotted") {
      ctx.fillStyle = dark;
      for (var d = 0; d < 6; d++) { ctx.beginPath(); ctx.arc(rnd(-bl * 0.35, bl * 0.35) * 0 + (d - 3) * bl * 0.12, ((d * 37) % 100 / 100 - 0.5) * bh * 0.7, bl * 0.05, 0, 7); ctx.fill(); }
    } else if (f.pattern === "gradient") {
      ctx.fillStyle = "hsla(" + ((f.hue + 40) % 360) + "," + f.sat + "%,60%,0.5)";
      ctx.fillRect(-bl * 0.5, -bh, bl * 0.4, bh * 2);
    }
    ctx.restore();

    // eye (on the head end)
    ctx.beginPath(); ctx.arc(bl * 0.3, -bh * 0.08, Math.max(2 * dpr, bl * 0.06), 0, 7); ctx.fillStyle = "#fff"; ctx.fill();
    ctx.beginPath(); ctx.arc(bl * 0.32, -bh * 0.08, Math.max(1 * dpr, bl * 0.032), 0, 7); ctx.fillStyle = "#08131c"; ctx.fill();
    ctx.restore();

    // name label (unscaled, upright)
    if (settings.showNames !== false) {
      ctx.save();
      ctx.font = (11 * dpr) + "px -apple-system, sans-serif";
      ctx.textAlign = "center"; ctx.fillStyle = "rgba(220,240,255,0.72)";
      ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 3 * dpr;
      ctx.fillText(f.name, f.x, f.y + bh * 0.5 + 15 * dpr);
      ctx.restore();
    }
    if (f.arriveGlow > 0) {
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      ctx.beginPath(); ctx.arc(f.x, f.y, bl * 0.7, 0, 7);
      ctx.fillStyle = "rgba(150,230,255," + (f.arriveGlow * 0.35) + ")"; ctx.fill(); ctx.restore();
    }
  }

  // ── fish physics ────────────────────────────────────────────────────
  function spawn(attrs, arriving) {
    var edge = Math.floor(Math.random() * 4);
    var f = Object.assign({}, attrs);
    f.baseLen = (34 + attrs.size * 30) * dpr;
    f.phase = Math.random() * 6;
    f.speedPx = (28 + attrs.speed * 34) * dpr;
    f.dir = Math.random() < 0.5 ? 1 : -1;
    f.tilt = 0; f.arriveGlow = arriving ? 1 : 0;
    if (arriving) {
      if (edge === 0) { f.x = -40 * dpr; f.y = rnd(0.2, 0.8) * H; f.dir = 1; }
      else if (edge === 1) { f.x = W + 40 * dpr; f.y = rnd(0.2, 0.8) * H; f.dir = -1; }
      else { f.x = rnd(0.2, 0.8) * W; f.y = edge === 2 ? -40 * dpr : H + 40 * dpr; }
    } else { f.x = rnd(0.15, 0.85) * W; f.y = rnd(0.2, 0.8) * H; }
    f.tx = rnd(0.1, 0.9) * W; f.ty = rnd(0.2, 0.82) * H;
    f.retarget = 0; f.leaving = false;
    return f;
  }
  function pickTarget(f) {
    if (f.leaving) return;
    f.tx = rnd(0.08, 0.92) * W;
    var band = f.personality === "bottom" ? [0.62, 0.84] : f.personality === "hoverer" ? [0.2, 0.5] : [0.15, 0.82];
    f.ty = rnd(band[0], band[1]) * H;
    f.retarget = rnd(2.5, 6);
  }
  function step(f, dt, t) {
    f.retarget -= dt;
    if (f.retarget <= 0) pickTarget(f);
    var dx = f.tx - f.x, dy = f.ty - f.y, d = Math.hypot(dx, dy) || 1;
    var spd = f.speedPx * (f.leaving ? 2.4 : 1) * (f.personality === "darter" ? 1.35 : 1);
    f.x += dx / d * spd * dt; f.y += dy / d * spd * dt;
    if (Math.abs(dx) > 6 * dpr) f.dir = dx > 0 ? 1 : -1;
    f.tilt = Math.max(-0.4, Math.min(0.4, dy / d * 0.5));
    if (f.arriveGlow > 0) f.arriveGlow = Math.max(0, f.arriveGlow - dt * 0.6);
    if (f.leaving && (f.x < -60 * dpr || f.x > W + 60 * dpr || f.y < -60 * dpr || f.y > H + 60 * dpr)) f.dead = true;
  }

  // ── roster sync ─────────────────────────────────────────────────────
  function syncRoster() {
    if (!data) return;
    var seen = {};
    (data.fish || []).forEach(function (a) {
      seen[a.id] = true;
      var f = fishMap[a.id];
      if (!f) { fishMap[a.id] = spawn(a, a.state === "provisional"); return; }
      // update attrs, handle departing
      f.name = a.name;
      if (a.state === "departing" && !f.leaving) {
        f.leaving = true;
        // aim at nearest horizontal edge
        f.tx = (f.x < W / 2) ? -80 * dpr : W + 80 * dpr;
        f.ty = f.y + rnd(-0.1, 0.1) * H;
      }
    });
    // fish gone from roster: if not already leaving, let them dart out; else drop
    Object.keys(fishMap).forEach(function (id) {
      if (!seen[id]) {
        var f = fishMap[id];
        if (!f.leaving) { f.leaving = true; f.tx = (f.x < W / 2) ? -80 * dpr : W + 80 * dpr; }
      }
    });
  }

  // ── render loop ─────────────────────────────────────────────────────
  var last = null;
  function frame(nowMs) {
    var t = nowMs / 1000;
    var dt = last === null ? 0 : Math.min(0.05, (nowMs - last) / 1000); last = nowMs;
    resize();
    drawWater(t); drawPlants(t);
    var ids = Object.keys(fishMap);
    // sort by y so lower fish overlap correctly
    ids.sort(function (a, b) { return fishMap[a].y - fishMap[b].y; });
    ids.forEach(function (id) {
      var f = fishMap[id];
      step(f, dt, t);
      drawFish(f, t);
      if (f.dead) delete fishMap[id];
    });
    drawBubbles(dt);
    requestAnimationFrame(frame);
  }

  // ── status + inspect UI ─────────────────────────────────────────────
  function renderStatus() {
    if (!data) return;
    document.body.classList.toggle("no-status", settings.showStatus === false);
    var st = document.getElementById("status");
    st.querySelector(".name").textContent = "🐠 " + (data.node ? data.node.name : "Fish Tank");
    var c = data.counts || {};
    st.querySelector(".sub").textContent = (c.resident || 0) + "/" + (data.node ? data.node.capacity : "?") + " fish"
      + (c.departing ? "  ·  " + c.departing + " leaving" : "") + (c.arriving ? "  ·  " + c.arriving + " arriving" : "");
    var peers = data.peers || [];
    st.querySelector(".peers").innerHTML = peers.length
      ? "peers: " + peers.map(function (p) { return "<b>" + esc(p.name) + "</b> " + p.count + "/" + p.capacity; }).join("  ")
      : "no other tanks online";
    var ev = document.getElementById("events"); ev.innerHTML = "";
    (data.events || []).slice(-5).reverse().forEach(function (e) {
      var d = document.createElement("div");
      d.className = e.kind === "outgoing" ? "go" : e.kind === "incoming" ? "come" : "";
      d.textContent = (e.kind === "outgoing" ? "→ " : e.kind === "incoming" ? "← " : "· ") + e.text;
      ev.appendChild(d);
    });
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }

  function inspectAt(cx, cy) {
    if (settings.tapToInspect === false) return;
    var px = cx * dpr, py = cy * dpr, best = null, bd = 1e9;
    Object.keys(fishMap).forEach(function (id) {
      var f = fishMap[id], d = Math.hypot(f.x - px, f.y - py);
      if (d < f.baseLen * 0.7 && d < bd) { bd = d; best = f; }
    });
    var card = document.getElementById("card");
    if (!best) { card.className = ""; return; }
    card.innerHTML = '<div class="cn"><span class="sw" style="background:hsl(' + best.hue + ',' + best.sat + '%,55%)"></span>' + esc(best.name) + '</div>'
      + row("species", best.species) + row("personality", best.personality)
      + row("pattern", best.pattern + " · " + best.fin + " fins")
      + row("size", best.size + "×  speed " + best.speed)
      + row("born in", best.bornNode) + row("tanks visited", String((best.hops || 0) + 1));
    card.className = "on";
    var cw = 220, ch = card.offsetHeight || 150;
    card.style.left = Math.max(8, Math.min(canvas.clientWidth - cw - 8, cx - cw / 2)) + "px";
    card.style.top = Math.max(8, Math.min(canvas.clientHeight - ch - 8, cy - ch - 20)) + "px";
    clearTimeout(inspectAt._t); inspectAt._t = setTimeout(function () { card.className = ""; }, 4000);
  }
  function row(k, v) { return '<div class="row"><span>' + k + '</span><span>' + esc(v) + '</span></div>'; }
  canvas.addEventListener("click", function (e) { var r = canvas.getBoundingClientRect(); inspectAt(e.clientX - r.left, e.clientY - r.top); });

  // ── data load ───────────────────────────────────────────────────────
  function loadData() {
    var s = document.createElement("script");
    s.src = "data.js?v=" + Date.now();
    s.onload = function () {
      s.remove();
      if (window.__FISHTANK__) {
        data = window.__FISHTANK__;
        document.getElementById("boot").classList.add("hidden");
        if (data.generatedAt !== lastGen) { lastGen = data.generatedAt; syncRoster(); }
        renderStatus();
      }
    };
    s.onerror = function () { s.remove(); if (!data) document.getElementById("boot").textContent = "Fish tank daemon not running — see README"; };
    document.head.appendChild(s);
  }

  function apply() { settings = Object.assign(settings, (window.Vardek && Vardek.settings) || {}); renderStatus(); }
  document.addEventListener("vardek:ready", apply);
  apply();
  resize();
  loadData(); setInterval(loadData, 2000);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
