<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plasma</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05060a; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var settings = { mode: "lava", palette: "tokyo", speed: 100 };

  // deep → mid → bright, as [r,g,b] 0-255
  var PALETTES = {
    tokyo:  [[13,16,28],[123,90,220],[120,162,247]],
    sunset: [[20,7,20],[220,55,110],[250,160,55]],
    ocean:  [[5,14,26],[22,110,150],[110,225,205]],
    acid:   [[8,16,8],[95,190,45],[220,245,70]],
    mono:   [[10,12,17],[80,88,105],[205,214,235]]
  };
  var rgb = function (c) { return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")"; };
  var lerp = function (a, b, t) { return a + (b - a) * t; };
  var mix = function (a, b, t) { return [Math.round(lerp(a[0], b[0], t)), Math.round(lerp(a[1], b[1], t)), Math.round(lerp(a[2], b[2], t))]; };

  var W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.round(canvas.clientWidth * dpr));
    var h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; W = w; H = h; buildBlobs(); }
  }

  // ── lava: rising/falling metaballs, additively blended + blurred ────
  var blobs = [];
  function buildBlobs() {
    blobs = [];
    var n = Math.max(5, Math.round(W / dpr / 260));
    for (var i = 0; i < n; i++) {
      blobs.push({
        x: Math.random(),
        r: (0.12 + Math.random() * 0.16),
        phase: Math.random() * Math.PI * 2,
        period: 9 + Math.random() * 12,     // seconds for a full rise+fall
        drift: (Math.random() - 0.5) * 0.04,
        depth: Math.random()                // colour: 0 mid → 1 bright
      });
    }
  }

  function drawLava(t, pal) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(pal[0]));
    g.addColorStop(1, rgb(mix(pal[0], pal[1], 0.25)));
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.filter = "blur(" + Math.round(W / 90) + "px)";
    ctx.globalCompositeOperation = "lighter";
    var unit = Math.min(W, H);
    for (var i = 0; i < blobs.length; i++) {
      var b = blobs[i];
      var yc = 0.5 + 0.42 * Math.sin(t * (2 * Math.PI / b.period) + b.phase);   // lava bob
      var xc = (b.x + b.drift * t) % 1.2; if (xc < -0.1) xc += 1.2;
      var cx = xc * W, cy = yc * H, rad = b.r * unit;
      var col = mix(pal[1], pal[2], b.depth * 0.5 + 0.3 + 0.2 * Math.sin(t * 0.3 + b.phase));
      var rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
      rg.addColorStop(0, "rgba(" + col[0] + "," + col[1] + "," + col[2] + ",0.95)");
      rg.addColorStop(0.55, "rgba(" + col[0] + "," + col[1] + "," + col[2] + ",0.35)");
      rg.addColorStop(1, "rgba(" + col[0] + "," + col[1] + "," + col[2] + ",0)");
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    vignette();
  }

  // ── plasma: low-res sine field, palette-ramped, scaled up ───────────
  var pc = document.createElement("canvas"), pctx = pc.getContext("2d"), pimg = null, RAMP = null;
  function buildRamp(pal) {
    RAMP = new Uint8Array(256 * 3);
    for (var i = 0; i < 256; i++) {
      var x = i / 255, c = x < 0.5 ? mix(pal[0], pal[1], x * 2) : mix(pal[1], pal[2], (x - 0.5) * 2);
      RAMP[i * 3] = c[0]; RAMP[i * 3 + 1] = c[1]; RAMP[i * 3 + 2] = c[2];
    }
  }
  function drawPlasma(t, pal) {
    var lw = 200, lh = Math.max(1, Math.round(200 * H / W));
    if (pc.width !== lw || pc.height !== lh) { pc.width = lw; pc.height = lh; pimg = pctx.createImageData(lw, lh); }
    if (!RAMP) buildRamp(pal);
    var d = pimg.data, k = 0;
    for (var y = 0; y < lh; y++) {
      var fy = y / lh;
      for (var x = 0; x < lw; x++) {
        var fx = x / lw;
        var v = Math.sin(fx * 8 + t * 1.1) + Math.sin(fy * 9 - t * 1.3)
              + Math.sin((fx + fy) * 7 + t * 0.9)
              + Math.sin(Math.hypot(fx - 0.5, fy - 0.5) * 16 - t * 1.7);
        var idx = ((v + 4) / 8 * 255) | 0;        // sine sum is [-4,4] → [0,255]
        idx = idx < 0 ? 0 : idx > 255 ? 255 : idx;
        d[k] = RAMP[idx * 3]; d[k + 1] = RAMP[idx * 3 + 1]; d[k + 2] = RAMP[idx * 3 + 2]; d[k + 3] = 255; k += 4;
      }
    }
    pctx.putImageData(pimg, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    ctx.drawImage(pc, 0, 0, lw, lh, 0, 0, W, H);
  }

  // ── aurora: drifting vertical curtains ──────────────────────────────
  function drawAurora(t, pal) {
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = rgb(pal[0]); ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    var bands = 5;
    for (var i = 0; i < bands; i++) {
      var p = i / bands;
      var cx = (0.5 + 0.45 * Math.sin(t * 0.3 + i * 1.7) + 0.1 * Math.sin(t * 0.11 + i)) * W;
      var w = W * (0.16 + 0.06 * Math.sin(t * 0.5 + i));
      var col = mix(pal[1], pal[2], (i % 2 ? 0.75 : 0.35));
      var g = ctx.createLinearGradient(cx - w, 0, cx + w, 0);
      g.addColorStop(0, "rgba(" + col[0] + "," + col[1] + "," + col[2] + ",0)");
      g.addColorStop(0.5, "rgba(" + col[0] + "," + col[1] + "," + col[2] + ",0.5)");
      g.addColorStop(1, "rgba(" + col[0] + "," + col[1] + "," + col[2] + ",0)");
      ctx.fillStyle = g; ctx.fillRect(cx - w, 0, w * 2, H);
    }
    vignette();
  }

  function vignette() {
    ctx.globalCompositeOperation = "source-over";
    var v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.35)");
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }

  var startT = null, raf = null, lastPal = null;
  function frame(now) {
    if (startT === null) startT = now;
    resize();
    var pal = PALETTES[settings.palette] || PALETTES.tokyo;
    if (pal !== lastPal) { lastPal = pal; RAMP = null; }
    var spd = (Number(settings.speed) || 100) / 100;
    var t = ((now - startT) / 1000) * spd;
    if (settings.mode === "plasma") drawPlasma(t, pal);
    else if (settings.mode === "aurora") drawAurora(t, pal);
    else drawLava(t, pal);
    raf = requestAnimationFrame(frame);
  }

  function apply() { if (window.Vardek && Vardek.settings) settings = Object.assign(settings, Vardek.settings); RAMP = null; buildBlobs(); }
  document.addEventListener("vardek:ready", apply);
  window.addEventListener("resize", resize);
  apply();
  raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
