<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hacker News</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #11151f; --surface: #161b28; --surface-2: #1b2130; --border: #2a3350;
    --text: #e6e9ef; --text-mid: #8089a6; --text-dim: #565f89;
    --accent: #ff6600;              /* Hacker News orange */
    --green: #9ece6a; --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
  }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
               font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }
  #wrap { display: flex; flex-direction: column; height: 100vh; padding: 18px 22px 12px; }

  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .logo { width: 30px; height: 30px; border-radius: 6px; background: var(--accent); color: #fff; font-weight: 800;
          font-size: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: Verdana, sans-serif; }
  .head h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }
  .head .feed { font-family: var(--mono); font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--accent);
                border: 1px solid rgba(255,102,0,.4); border-radius: 6px; padding: 2px 8px; }
  .head .sp { flex: 1; }
  .head .upd { font-family: var(--mono); font-size: .8rem; color: var(--text-dim); }
  body.stale .head .upd { color: #e0af68; }

  #list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
          display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: min-content; gap: 4px 26px; align-content: start; }
  #list::-webkit-scrollbar { width: 6px; } #list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .story { display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 9px 8px; border-radius: 8px; cursor: pointer;
           align-items: baseline; transition: background .1s; }
  .story:active, .story.press { background: var(--surface); }
  .story .rank { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 1.05rem; color: var(--text-dim); text-align: right; }
  .story .body { min-width: 0; }
  .story .title { font-size: 1.15rem; font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis;
                  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .story .title .dom { font-family: var(--mono); font-size: .8rem; font-weight: 500; color: var(--text-dim); margin-left: 7px; white-space: nowrap; }
  .story .meta { display: flex; align-items: center; gap: 10px; margin-top: 3px; font-family: var(--mono);
                 font-variant-numeric: tabular-nums; font-size: .82rem; color: var(--text-mid); flex-wrap: wrap; }
  .story .meta .pts { color: var(--accent); }
  .story .meta .cm { color: var(--text-mid); border-bottom: 1px solid transparent; padding-bottom: 1px; }
  .story .meta .cm:active { border-bottom-color: var(--accent); }
  .story .meta .dim { color: var(--text-dim); }
  .story .meta .hot { color: #e0af68; }

  /* states */
  #overlay { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
             gap: 14px; background: var(--bg); color: var(--text-dim); z-index: 5; text-align: center; padding: 30px; }
  body.loading #overlay, body.error #overlay { display: flex; }
  .spinner { width: 38px; height: 38px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #overlay .msg { font-size: 1rem; max-width: 520px; line-height: 1.5; }
  body.error .spinner { display: none; }
  body.error #overlay .msg { color: #f7768e; font-family: var(--mono); font-size: .9rem; }
  body:not(.loading):not(.error) #list { display: grid; }

  @media (max-width: 1200px) { #list { grid-template-columns: 1fr; } }
  @media (max-height: 220px) {
    #wrap { padding: 10px 14px; } .head { margin-bottom: 8px; } .head h1 { font-size: 1.1rem; }
    .story { padding: 6px; } .story .title { font-size: 1rem; -webkit-line-clamp: 1; }
  }
</style>
</head>
<body class="loading">
  <div id="wrap">
    <div class="head">
      <div class="logo">Y</div>
      <h1>Hacker News</h1>
      <span class="feed" id="feed">TOP</span>
      <span class="sp"></span>
      <span class="upd" id="upd">loading…</span>
    </div>
    <div id="list"></div>
  </div>
  <div id="overlay">
    <div class="spinner"></div>
    <div class="msg" id="msg">Loading stories…</div>
  </div>

<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';

  var settings = { feed: "top", count: 14 };
  var $ = function (id) { return document.getElementById(id); };
  var lastLoaded = 0, lastStories = null;

  var FEEDS = {
    top:  { label: "TOP",  url: "https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=30" },
    new:  { label: "NEW",  url: "https://hn.algolia.com/api/v1/search_by_date?tags=story&hitsPerPage=30" },
    ask:  { label: "ASK",  url: "https://hn.algolia.com/api/v1/search?tags=ask_hn&hitsPerPage=30" },
    show: { label: "SHOW", url: "https://hn.algolia.com/api/v1/search?tags=show_hn&hitsPerPage=30" }
  };

  function domainOf(url) {
    if (!url) return "";
    try { var h = new URL(url).hostname.replace(/^www\./, ""); return h; } catch (e) { return ""; }
  }
  function ago(sec) {
    var s = Math.max(0, Math.floor(Date.now() / 1000 - sec));
    if (s < 3600) return Math.floor(s / 60) + "m";
    if (s < 86400) return Math.floor(s / 3600) + "h";
    return Math.floor(s / 86400) + "d";
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function render(hits) {
    var list = $("list"); list.textContent = "";
    var n = Math.max(1, Math.min(30, Number(settings.count) || 14));
    hits.slice(0, n).forEach(function (h, i) {
      var itemUrl = "https://news.ycombinator.com/item?id=" + h.objectID;
      var target = h.url || itemUrl;
      var row = el("div", "story");
      row.appendChild(el("div", "rank", String(i + 1)));
      var body = el("div", "body");
      var title = el("div", "title");
      title.appendChild(document.createTextNode(h.title || "(untitled)"));
      var dom = domainOf(h.url);
      if (dom) title.appendChild(el("span", "dom", dom));
      body.appendChild(title);
      var meta = el("div", "meta");
      var pts = h.points || 0;
      meta.appendChild(el("span", (pts >= 300 ? "pts hot" : "pts"), "▲ " + pts));
      var cm = el("span", "cm", (h.num_comments || 0) + " comments");
      cm.addEventListener("click", function (e) { e.stopPropagation(); open(itemUrl, cm); });
      meta.appendChild(cm);
      if (dom) meta.appendChild(el("span", "dim", "·"));
      meta.appendChild(el("span", "dim", ago(h.created_at_i) + " · " + (h.author || "")));
      body.appendChild(meta);
      row.appendChild(body);
      row.addEventListener("click", function () { open(target, row); });
      list.appendChild(row);
    });
  }

  function open(url, node) {
    if (node) { node.classList.add("press"); setTimeout(function () { node.classList.remove("press"); }, 150); }
    try { xemd.openLink(url); } catch (e) {}
  }

  async function load() {
    if (Date.now() - lastLoaded < 3000) return;
    lastLoaded = Date.now();
    var feed = FEEDS[settings.feed] || FEEDS.top;
    $("feed").textContent = feed.label;
    try {
      var res = await xemd.proxy.fetch(feed.url, { headers: { "Accept": "application/json" } });
      if (!res.ok) throw new Error("HTTP " + res.status);
      var data = await res.json();
      var hits = (data.hits || []).filter(function (h) { return h.title; });
      if (!hits.length) throw new Error("no stories returned");
      lastStories = hits;
      render(hits);
      document.body.classList.remove("loading", "error", "stale");
      $("upd").textContent = "updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    } catch (e) {
      if (lastStories) {              // keep showing the last good list, just mark it stale
        document.body.classList.add("stale"); document.body.classList.remove("loading", "error");
        $("upd").textContent = "offline · " + (e.message || "fetch failed");
      } else {
        document.body.classList.remove("loading"); document.body.classList.add("error");
        $("msg").textContent = "Couldn't load Hacker News: " + (e.message || e) +
          "  —  the widget fetches hn.algolia.com through Vardek's proxy.";
      }
    }
  }

  function applySettings() {
    var s = null;
    try { s = xemd.settings; } catch (e) {}
    // settings come async via onSettingsChange / initial get
  }

  // boot: get settings, then load; refresh on the runtime's timer and our own poll
  (async function () {
    try {
      var s = await Promise.race([xemd.settings.get(), new Promise(function (r) { setTimeout(function () { r(null); }, 1500); })]);
      if (s && typeof s === "object") settings = Object.assign(settings, s);
    } catch (e) {}
    xemd.onSettingsChange(function (s) { if (s && typeof s === "object") { settings = Object.assign(settings, s); if (lastStories) render(lastStories); lastLoaded = 0; load(); } });
    xemd.onRefresh(function () { lastLoaded = 0; load(); });
    xemd.ready();
    load();
    setInterval(load, 300000);        // belt-and-braces every 5 min
  })();
</script>
</body>
</html>
