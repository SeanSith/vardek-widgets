<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Holidays</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0b0e15;--surface:#161b28;--border:#2a3350;--text:#e6e9ef;--mid:#8089a6;--dim:#565f89;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;--accent:#f7768e;--err:#f7768e}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
  #wrap{position:absolute;inset:0;display:flex;padding:28px 32px;gap:32px}
  .hero{flex:0 0 40%;min-width:0;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--border);padding-right:30px}
  .hero .lbl{font-size:.85rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .hero .in{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:3.4rem;line-height:1;color:var(--accent);margin:6px 0 8px}
  .hero .nm{font-size:1.9rem;font-weight:700;line-height:1.12}
  .hero .dt{font-size:1.1rem;color:var(--mid);margin-top:6px}
  .list{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
  .list .h{font-size:.8rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  .row{display:grid;grid-template-columns:3.4em 1fr auto;align-items:center;gap:14px;padding:8px 2px}
  .row+.row{border-top:1px solid rgba(42,51,80,.5)}
  .row .d{text-align:center;font-family:var(--mono);line-height:1}
  .row .d .mo{font-size:.7rem;color:var(--dim);text-transform:uppercase}.row .d .dy{font-size:1.4rem;font-weight:700}
  .row .nm{min-width:0;font-size:1.05rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .nm .wd{color:var(--dim);font-weight:400;font-size:.85rem;margin-left:6px}
  .row .away{font-family:var(--mono);font-size:.9rem;color:var(--mid);white-space:nowrap}
  #status{position:fixed;left:32px;bottom:7px;font-family:var(--mono);font-size:.72rem;color:var(--dim)}#status.err{color:var(--err)}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}#boot.hidden{display:none}
</style></head>
<body>
  <div id="boot">connecting…</div>
  <div id="wrap" style="display:none">
    <div class="hero"><div class="lbl" id="lbl">Next holiday</div><div class="in" id="in"></div><div class="nm" id="nm"></div><div class="dt" id="dt"></div></div>
    <div class="list"><div class="h" id="lh">Upcoming</div><div id="rows"></div></div>
  </div>
  <div id="status"></div>
<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';
  var settings={country:"US"};
  var $=function(i){return document.getElementById(i)}, last=0;
  function dayStart(d){var x=new Date(d);x.setHours(0,0,0,0);return x}
  function daysUntil(iso){var t=new Date(iso+"T00:00:00");return Math.round((dayStart(t)-dayStart(new Date()))/86400000)}
  function esc(s){return String(s||"").replace(/[<>&]/g,function(c){return{"<":"&lt;",">":"&gt;","&":"&amp;"}[c]})}
  function inWords(n){if(n===0)return"Today";if(n===1)return"Tomorrow";return"in "+n+" days"}
  function render(hols){
    var future=hols.filter(function(h){return daysUntil(h.date)>=0});
    if(!future.length){$("boot").textContent="No upcoming holidays";return}
    var nx=future[0], n=daysUntil(nx.date), d=new Date(nx.date+"T00:00:00");
    $("in").textContent=n===0?"Today":n===1?"Tomorrow":n;
    $("lbl").textContent=n<=1?"Next holiday":"Next holiday in";
    if(n>1){$("in").insertAdjacentHTML("beforeend",'<span style="font-size:1.1rem;color:var(--mid);font-weight:500"> days</span>')}
    $("nm").textContent=nx.localName+(nx.name&&nx.name!==nx.localName?" · "+nx.name:"");
    $("dt").textContent=d.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric",year:"numeric"});
    $("rows").innerHTML=future.slice(1,7).map(function(h){
      var dd=new Date(h.date+"T00:00:00"),n=daysUntil(h.date);
      return '<div class="row"><div class="d"><div class="mo">'+dd.toLocaleDateString([],{month:"short"})+'</div><div class="dy">'+dd.getDate()+'</div></div>'
        +'<div class="nm">'+esc(h.localName)+'<span class="wd">'+dd.toLocaleDateString([],{weekday:"short"})+'</span></div>'
        +'<div class="away">'+inWords(n)+'</div></div>';
    }).join("");
    $("boot").classList.add("hidden");$("wrap").style.display="flex";
  }
  async function load(){
    if(Date.now()-last<30000)return; last=Date.now();
    try{
      var cc=(settings.country||"US").trim().toUpperCase();
      var res=await xemd.proxy.fetch("https://date.nager.at/api/v3/NextPublicHolidays/"+cc,{headers:{Accept:"application/json"}});
      if(!res.ok)throw new Error("HTTP "+res.status);
      var hols=await res.json();if(!hols.length)throw new Error("no holidays");
      $("lh").textContent="Upcoming · "+cc;
      render(hols);
      $("status").className="";$("status").textContent="Nager.Date · "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    }catch(e){$("status").className="err";$("status").textContent="holidays: "+(e.message||e);if($("wrap").style.display==="none")$("boot").textContent="holidays unavailable — check country code"}
  }
  (async function(){
    try{var s=await Promise.race([xemd.settings.get(),new Promise(function(r){setTimeout(function(){r(null)},1500)})]);if(s)settings=Object.assign(settings,s)}catch(e){}
    xemd.onSettingsChange(function(s){if(s)settings=Object.assign(settings,s);last=0;load()});
    xemd.onRefresh(function(){last=0;load()});xemd.ready();load();setInterval(load,21600000);
  })();
</script></body></html>
