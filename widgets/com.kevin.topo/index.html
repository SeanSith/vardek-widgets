<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Topographic</title>
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#070a10}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';
  var settings={palette:"terrain",detail:1};
  var PAL={terrain:function(t){return "hsl("+(120-t*110)+","+(50+t*20)+"%,"+(30+t*40)+"%)"},
    depth:function(t){return "hsl("+(220-t*40)+",70%,"+(20+t*55)+"%)"},heat:function(t){return "hsl("+(260-t*260)+",85%,55%)"},
    mono:function(t){return "hsl(210,10%,"+(25+t*65)+"%)"},aurora:function(t){return "hsl("+(160+t*120)+",75%,"+(35+t*30)+"%)"}};
  var perm=new Array(512);(function(){var p=[];for(var i=0;i<256;i++)p[i]=i;for(var i=255;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=p[i];p[i]=p[j];p[j]=t}for(var i=0;i<512;i++)perm[i]=p[i&255]})();
  function fade(t){return t*t*t*(t*(t*6-15)+10)}function lerp(a,b,t){return a+t*(b-a)}
  function grad(h,x,y){var u=(h&1)===0?x:y,v=(h&2)===0?y:x;return((h&4)===0?u:-u)+((h&8)===0?v:-v)}
  function noise(x,y){var X=Math.floor(x)&255,Y=Math.floor(y)&255;x-=Math.floor(x);y-=Math.floor(y);var u=fade(x),v=fade(y),a=perm[X]+Y,b=perm[X+1]+Y;
    return lerp(lerp(grad(perm[a],x,y),grad(perm[b],x-1,y),u),lerp(grad(perm[a+1],x,y-1),grad(perm[b+1],x-1,y-1),u),v)}
  function fbm(x,y){return noise(x,y)*0.6+noise(x*2+5,y*2+5)*0.3+noise(x*4+9,y*4+9)*0.12}
  var cv=document.getElementById("c"),ctx=cv.getContext("2d"),W,H,dpr,cs,gw,gh,vals,t=0;
  var SEG={1:[[3,0]],2:[[0,1]],3:[[3,1]],4:[[1,2]],5:[[3,0],[1,2]],6:[[0,2]],7:[[3,2]],8:[[2,3]],9:[[2,0]],10:[[0,1],[2,3]],11:[[2,1]],12:[[1,3]],13:[[1,0]],14:[[0,3]]};
  function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=Math.round(cv.clientWidth*dpr);H=Math.round(cv.clientHeight*dpr);cv.width=W;cv.height=H;
    cs=Math.max(8,Math.round(12/(Number(settings.detail)||1)*dpr));gw=Math.ceil(W/cs)+1;gh=Math.ceil(H/cs)+1;vals=new Float32Array(gw*gh)}
  function ept(e,x,y,vTL,vTR,vBR,vBL,L){
    // edges: 0=T(TL-TR),1=R(TR-BR),2=B(BL-BR),3=L(TL-BL)
    function ip(a,b){var d=b-a;return Math.abs(d)<1e-6?0.5:(L-a)/d}
    if(e===0)return [x+ip(vTL,vTR)*cs,y];
    if(e===1)return [x+cs,y+ip(vTR,vBR)*cs];
    if(e===2)return [x+ip(vBL,vBR)*cs,y+cs];
    return [x,y+ip(vTL,vBL)*cs];
  }
  function frame(){
    ctx.fillStyle="#070a10";ctx.fillRect(0,0,W,H);
    var scl=0.006/dpr;
    for(var gy=0;gy<gh;gy++)for(var gx=0;gx<gw;gx++)vals[gy*gw+gx]=fbm(gx*cs*scl+t*0.12,gy*cs*scl-t*0.05);
    var pal=PAL[settings.palette]||PAL.terrain,levels=10;
    ctx.lineWidth=1.4*dpr;ctx.lineCap="round";
    for(var li=0;li<levels;li++){var L=-0.5+li/(levels-1)*1.0,tt=li/(levels-1);
      ctx.strokeStyle=pal(tt);ctx.globalAlpha=0.85;ctx.beginPath();
      for(var y=0;y<gh-1;y++)for(var x=0;x<gw-1;x++){
        var vTL=vals[y*gw+x],vTR=vals[y*gw+x+1],vBR=vals[(y+1)*gw+x+1],vBL=vals[(y+1)*gw+x];
        var cse=(vTL>L?1:0)|(vTR>L?2:0)|(vBR>L?4:0)|(vBL>L?8:0);
        var segs=SEG[cse];if(!segs)continue;var px=x*cs,py=y*cs;
        for(var si=0;si<segs.length;si++){var a=ept(segs[si][0],px,py,vTL,vTR,vBR,vBL,L),b=ept(segs[si][1],px,py,vTL,vTR,vBR,vBL,L);
          ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1])}}
      ctx.stroke();
    }
    ctx.globalAlpha=1;t+=0.02;requestAnimationFrame(frame);
  }
  (async function(){
    try{var s=await Promise.race([xemd.settings.get(),new Promise(function(r){setTimeout(function(){r(null)},1500)})]);if(s)settings=Object.assign(settings,s)}catch(e){}
    xemd.onSettingsChange(function(s){if(s)settings=Object.assign(settings,s);resize()});
    xemd.ready();resize();requestAnimationFrame(frame);window.addEventListener("resize",resize);
  })();
</script></body></html>
