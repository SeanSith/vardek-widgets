<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Life Zoo</title>
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#05070a;font-family:ui-monospace,Menlo,monospace}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#lbl{position:absolute;left:20px;top:16px;color:#6b7686}#lbl b{color:#cfe0d6;font-size:1.05rem}#lbl .g{font-size:.75rem;color:#3d4756}</style></head>
<body><canvas id="c"></canvas><div id="lbl"><b id="name">—</b><div class="g" id="gen"></div></div>
<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';
  var settings={palette:"green",cell:9};
  var PAL={green:["#0a1410","#3fb56b","#b6ffcf"],amber:["#140f06","#d9962e","#ffe4a3"],cyan:["#06131a","#38b6d6","#c3f2ff"],magma:["#150608","#d1462f","#ffd27a"]};
  var cv=document.getElementById("c"),ctx=cv.getContext("2d");
  var W,H,dpr,cs,gw,gh,cells,age,gen=0,pIdx=0,cycleAt=0,name="";
  function coords(list){return list}
  function ascii(str){var rows=str.trim().split("\n"),out=[];for(var y=0;y<rows.length;y++)for(var x=0;x<rows[y].length;x++)if(rows[y][x]==="#")out.push([x,y]);return out}
  var P=[
    {n:"Gosper Glider Gun",gens:600,c:coords([[0,4],[0,5],[1,4],[1,5],[10,4],[10,5],[10,6],[11,3],[11,7],[12,2],[12,8],[13,2],[13,8],[14,5],[15,3],[15,7],[16,4],[16,5],[16,6],[17,5],[20,2],[20,3],[20,4],[21,2],[21,3],[21,4],[22,1],[22,5],[24,0],[24,1],[24,5],[24,6],[34,2],[34,3],[35,2],[35,3]])},
    {n:"Pulsar",gens:180,c:ascii("..###...###..\n.............\n#....#.#....#\n#....#.#....#\n#....#.#....#\n..###...###..\n.............\n..###...###..\n#....#.#....#\n#....#.#....#\n#....#.#....#\n.............\n..###...###..")},
    {n:"Acorn",gens:700,c:coords([[1,0],[3,1],[0,2],[1,2],[4,2],[5,2],[6,2]])},
    {n:"R-pentomino",gens:500,c:coords([[1,0],[2,0],[0,1],[1,1],[1,2]])},
    {n:"Lightweight Spaceship",gens:260,c:ascii(".#..#\n#....\n#...#\n####.")},
    {n:"Diehard",gens:200,c:coords([[6,0],[0,1],[1,1],[1,2],[5,2],[6,2],[7,2]])}
  ];
  function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=Math.round(cv.clientWidth*dpr);H=Math.round(cv.clientHeight*dpr);cv.width=W;cv.height=H;
    cs=Math.max(4,Math.round((Number(settings.cell)||9)*dpr));gw=Math.floor(W/cs);gh=Math.floor(H/cs);load(pIdx)}
  function load(i){pIdx=((i%P.length)+P.length)%P.length;var pat=P[pIdx];name=pat.n;gen=0;cycleAt=pat.gens;
    cells=new Uint8Array(gw*gh);age=new Uint8Array(gw*gh);
    var xs=pat.c.map(function(p){return p[0]}),ys=pat.c.map(function(p){return p[1]});
    var pw=Math.max.apply(null,xs)+1,ph=Math.max.apply(null,ys)+1;
    var ox=Math.floor((gw-pw)/2),oy=Math.floor((gh-ph)/2);
    pat.c.forEach(function(p){var x=ox+p[0],y=oy+p[1];if(x>=0&&x<gw&&y>=0&&y<gh){cells[y*gw+x]=1;age[y*gw+x]=1}});
  }
  function step(){
    var nc=new Uint8Array(gw*gh);
    for(var y=0;y<gh;y++)for(var x=0;x<gw;x++){var n=0;
      for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;var xx=(x+dx+gw)%gw,yy=(y+dy+gh)%gh;n+=cells[yy*gw+xx]}
      var i=y*gw+x,al=cells[i];var live=al?(n===2||n===3):(n===3);nc[i]=live?1:0;
      if(live){age[i]=al?Math.min(255,age[i]+1):1}else age[i]=0;}
    cells=nc;gen++;
    if(gen>=cycleAt)load(pIdx+1);
  }
  function draw(){
    var pal=PAL[settings.palette]||PAL.green;ctx.fillStyle=pal[0];ctx.fillRect(0,0,W,H);
    function mix(a,b,f){function h(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}var A=h(a),B=h(b);return "rgb("+Math.round(A[0]+(B[0]-A[0])*f)+","+Math.round(A[1]+(B[1]-A[1])*f)+","+Math.round(A[2]+(B[2]-A[2])*f)+")"}
    for(var y=0;y<gh;y++)for(var x=0;x<gw;x++){var i=y*gw+x;if(cells[i]){var f=Math.min(1,age[i]/12);
      ctx.fillStyle=mix(pal[2],pal[1],f);ctx.fillRect(x*cs,y*cs,cs-dpr,cs-dpr)}}
    document.getElementById("name").textContent=name;document.getElementById("gen").textContent="generation "+gen;
  }
  var acc=0;
  function frame(ts){acc++;if(acc>=3){acc=0;step()}draw();requestAnimationFrame(frame)}
  (async function(){
    try{var s=await Promise.race([xemd.settings.get(),new Promise(function(r){setTimeout(function(){r(null)},1500)})]);if(s)settings=Object.assign(settings,s)}catch(e){}
    xemd.onSettingsChange(function(s){if(s)settings=Object.assign(settings,s);resize()});
    xemd.ready();resize();requestAnimationFrame(frame);window.addEventListener("resize",resize);
  })();
</script></body></html>
