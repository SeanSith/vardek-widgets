<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cocktail</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#120c14;--surface:#1e1622;--border:#352a3d;--text:#f3e9f0;--mid:#b39dae;--dim:#7a6a76;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;--accent:#e6a3c7;--gold:#e0c07a}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
  #wrap{position:absolute;inset:0;display:flex;padding:26px 30px;gap:30px}
  .photo{flex:0 0 38%;border-radius:16px;overflow:hidden;background:var(--surface);position:relative}
  .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
  .photo img.show{opacity:1}
  .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
  .inner{transition:opacity .45s}
  .name{font-size:2.3rem;font-weight:700;line-height:1.08}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
  .chip{font-size:.82rem;border:1px solid var(--border);border-radius:20px;padding:4px 11px;color:var(--mid)}
  .chip.alc{color:var(--gold);border-color:rgba(224,192,122,.4)}
  .ings{display:flex;flex-direction:column;gap:3px;margin-bottom:12px}
  .ings .i{font-size:1.05rem;display:flex;gap:8px}
  .ings .i::before{content:"•";color:var(--accent)}
  .instr{color:var(--mid);font-size:.95rem;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .dots{display:flex;gap:6px;margin-top:14px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--border);transition:background .3s,width .3s}.dots i.on{background:var(--accent);width:18px;border-radius:3px}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);text-align:center;padding:30px}#boot.hidden{display:none}
</style></head>
<body>
  <div id="boot">Waiting for cocktaild…<br><span style="font-size:.8rem;opacity:.7">run cocktaild once, or load its LaunchAgent</span></div>
  <div id="wrap" style="display:none">
    <div class="photo"><img id="img" alt=""></div>
    <div class="info"><div class="inner" id="inner">
      <div class="name" id="name"></div>
      <div class="chips" id="chips"></div>
      <div class="ings" id="ings"></div>
      <div class="instr" id="instr"></div>
    </div><div class="dots" id="dots"></div></div>
  </div>
<script>
(function(){
  "use strict";
  var settings={rotateSec:16,alcoholic:"any"};var $=function(i){return document.getElementById(i)};
  var drinks=[],order=[],idx=-1,timer=null,dataKey="";
  function esc(s){return String(s||"").replace(/[<>&]/g,function(c){return{"<":"&lt;",">":"&gt;","&":"&amp;"}[c]})}
  function filtered(){return drinks.filter(function(d){
    if(settings.alcoholic==="alcoholic")return /alcoholic/i.test(d.alcoholic)&&!/non/i.test(d.alcoholic);
    if(settings.alcoholic==="non")return /non/i.test(d.alcoholic);return true;})}
  function show(i){
    var list=filtered();if(!list.length)return;idx=(i+list.length)%list.length;var d=list[idx];
    var inner=$("inner"),img=$("img");inner.style.opacity="0";img.classList.remove("show");
    setTimeout(function(){
      $("name").textContent=d.name;
      var chips=[];if(d.category)chips.push(['chip',d.category]);if(d.glass)chips.push(['chip',d.glass]);if(d.alcoholic)chips.push([/non/i.test(d.alcoholic)?'chip':'chip alc',d.alcoholic]);
      $("chips").innerHTML=chips.map(function(c){return '<span class="'+c[0]+'">'+esc(c[1])+'</span>'}).join("");
      $("ings").innerHTML=(d.ingredients||[]).slice(0,7).map(function(x){return '<div class="i">'+esc(x)+'</div>'}).join("");
      $("instr").textContent=d.instructions||"";
      if(d.file){img.onload=function(){img.classList.add("show")};img.src=d.file+"?i="+d.id}else img.removeAttribute("src");
      inner.style.opacity="1";
      $("dots").innerHTML=list.map(function(_,k){return '<i class="'+(k===idx?"on":"")+'"></i>'}).join("");
    },240);
  }
  function schedule(){if(timer)clearInterval(timer);timer=setInterval(function(){show(idx+1)},Math.max(6,Number(settings.rotateSec)||16)*1000)}
  function load(){var s=document.createElement("script");s.src="data.js?v="+Date.now();
    s.onload=function(){s.remove();var d=window.__COCKTAILS__;if(!d)return;var key=(d.drinks||[]).map(function(x){return x.id}).join(",");
      if(key!==dataKey){dataKey=key;drinks=d.drinks||[];idx=-1;if(filtered().length){$("boot").classList.add("hidden");$("wrap").style.display="flex";show(0);schedule()}}};
    s.onerror=function(){s.remove();if(!drinks.length)$("boot").textContent="cocktaild not running — see README"};
    document.head.appendChild(s)}
  if(window.Vardek&&Vardek.settings)settings=Object.assign(settings,Vardek.settings);
  if(window.Vardek&&Vardek.onSettingsChange)Vardek.onSettingsChange(function(s){if(s)settings=Object.assign(settings,s);idx=-1;if(filtered().length){show(0);schedule()}});
  if(window.Vardek&&Vardek.onRefresh)Vardek.onRefresh(load);
  load();setInterval(load,60000);
})();
</script></body></html>
